services:
  - type: web
    name: hr-ai-builder-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: FRONTEND_URL
        value: https://learning.meansights.com
      - key: CONTENT_GATE      # 微信登录跑通后拨成 on，代码零改动
        value: "off"
      - key: WX_OAUTH_CALLBACK
        value: https://hr-ai-builder-api.onrender.com/api/wx/oauth/callback
      # 会话签名密钥。必须由 Render 生成并固定下来——
      # ⚠️ 没有它时 auth.py 退回「进程内随机串」，后端每次重启/免费档休眠都会让
      #    全站 token 集体失效；登录改成强制之后，那等于整站定期锁死。
      #    generateValue 让 Render 自己生成，值不进仓库、也不经人手。
      - key: JWT_SECRET
        generateValue: true
      - key: DEEPSEEK_API_KEY      # Sparky 的模型 key
        sync: false
      - key: ADMIN_CODE            # 看 /api/sparky/insights 的口令；不填=端点直接 404
        sync: false
      - key: SERVERCHAN_KEY        # 新用户登录推送(Server酱 SendKey)；不填=只入表不推送
        sync: false
      - key: SMTP_HOST             # 或走邮件推送：smtp.163.com + 授权码；不填=不发
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: NOTIFY_TO
        sync: false
      # 持久层：两个都填上才切到 Supabase，否则退回内存（重启即丢）。建表 SQL 见 docs/supabase-schema.sql
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: WX_WEB_APPID          # 开放平台「网站应用」AppID（轨道 A·优先）
        sync: false
      - key: WX_WEB_APPSECRET
        sync: false
      - key: WX_APPID              # 小程序 AppID（轨道 B·兜底）
        sync: false
      - key: WX_APPSECRET
        sync: false

  - type: web
    name: hr-ai-builder-web
    runtime: static
    rootDir: frontend
    staticPublishPath: .
    # 安全头（2026-09-08 安全体检）。CSP 说明：页面里大量内联脚本/样式所以放开 unsafe-inline，
    # 但脚本只允许本域加载、只允许本站自己 iframe 嵌入（learn.html 嵌课件）、表单只能提交到本域；接口只放行本站后端与铭曦。
    # 改 API 域名或接第三方脚本时记得同步这里，否则会被静默拦截（浏览器 console 有 CSP 报错）。
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; font-src 'self' data:; connect-src 'self' https://hr-ai-builder-api.onrender.com https://*.meansights.com https://meansights-backend.onrender.com; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"

services:
  - type: web
    name: hr-ai-builder-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: ALLOWED_ORIGINS
        value: "*"

  - type: web
    name: hr-ai-builder-web
    runtime: static
    rootDir: frontend
    staticPublishPath: .

<script>
/* 强制登录：测评只对登录用户开放（免费,微信扫码一步） */
if(!localStorage.getItem('hab_token')){
  try{ sessionStorage.setItem('hab_next','quiz.html'); }catch(e){}
  location.replace('index.html#login');
}
const API=(location.hostname==='localhost'||location.protocol==='file:')
  ? 'http://localhost:8001' : 'https://hr-ai-builder-api.onrender.com';
const $=s=>document.querySelector(s);
const L='ABCD'.split('');
const TY={single:'单选',multi:'多选',judge:'判断'};

let ALL=[], STATS={}, CH={}, sel=null, MODE='exam';
let QS=[], picked={}, graded={};
const ORD={};                       // 题号 → 显示顺序到原始索引的映射

/* ══════════ 拉题库 ══════════ */
(async function(){
  try{
    const d=await (await fetch(API+'/api/quiz')).json();
    ALL=d.items; STATS=d.stats; CH=d.chapters;
    const k=d.stats.by_ksa||{};
    $('#nK').textContent=(k.K||0)+' 题'; $('#nS').textContent=(k.S||0)+' 题'; $('#nA').textContent=(k.A||0)+' 题';
    $('#meta').textContent=`题库共 ${d.stats.total} 题 · 单选 ${d.stats.by_type.single||0} · 多选 ${d.stats.by_type.multi||0} · 判断 ${d.stats.by_type.judge||0}`;
    renderPick();
  }catch(e){
    $('#hero').insertAdjacentHTML('beforeend','<p style="color:var(--danger);margin-top:16px">题库服务暂时不可用，请稍后重试。</p>');
  }
})();

/* ══════════ 选章 + 选模式 ══════════ */
function ksaOf(l){const c={K:0,S:0,A:0};l.forEach(x=>c[x.ksa]++);return c}
function badges(c){return ['K','S','A'].filter(k=>c[k]).map(k=>`<span class="b t-${k}">${k} ${c[k]}</span>`).join('')}
function poolOf(){ return sel==='__all'?ALL:ALL.filter(x=>x.chapter===sel) }
function examN(n){ return Math.min(n, Math.max(12, Math.round(n*0.6))) }

function renderPick(){
  const cards=Object.entries(CH).map(([id,name])=>{
    const qs=ALL.filter(x=>x.chapter===id);
    return `<div class="pk" data-ch="${id}"><div class="n">${name}</div>
      <div class="m"><span>${qs.length} 题</span>${badges(ksaOf(qs))}</div></div>`;
  }).join('');
  $('#pick').innerHTML=cards+
    `<div class="pk all" data-ch="__all"><div class="n">全部篇章 · 完整测评</div>
     <div class="m"><span>${ALL.length} 题</span>${badges(ksaOf(ALL))}<span style="color:var(--faint)">考试模式约 25 分钟</span></div></div>`
    +`<div style="grid-column:1/-1;margin-top:6px;font-size:12px;color:var(--faint);line-height:1.8">
        题库覆盖全部十个篇章，每章不少于 20 题，按 <b>K 知识 / S 技能 / A 判断</b> 三类分层出题。
        <b>不给总分</b>——三类补起来的代价完全不同，合并成一个数会把最重要的信息抹平。
      </div>`;
  $('#pick').querySelectorAll('.pk').forEach(el=>el.onclick=()=>{
    $('#pick').querySelectorAll('.pk').forEach(x=>x.classList.remove('on'));
    el.classList.add('on'); sel=el.dataset.ch; syncStart();
  });
}
function syncStart(){
  const n=poolOf().length, b=$('#start');
  b.disabled=false;
  b.textContent = MODE==='exam' ? `开始考试 · 抽 ${examN(n)} 题` : `开始刷题 · ${n} 题`;
}
document.querySelectorAll('.md').forEach(el=>el.onclick=()=>{
  document.querySelectorAll('.md').forEach(x=>x.classList.remove('on'));
  el.classList.add('on'); el.querySelector('input').checked=true;
  MODE=el.querySelector('input').value;
  if(sel) syncStart();
});

/* ══════════ 乱序 & 抽题 ══════════
   选项乱序：重考时能记住「上次选 B」的话，测的就不是理解了。
   显示顺序打乱，提交前映射回原始索引，服务端判分逻辑不用改。 */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function prep(list){
  return list.map(q=>{
    if(q.type==='judge'){ ORD[q.id]=[0,1]; return q; }   // 「错/对」顺序固定才好读
    const ord=shuffle(q.opts.map((_,i)=>i));
    ORD[q.id]=ord;
    return {...q, opts: ord.map(i=>q.opts[i])};
  });
}
const toOriginal=(qid,v)=>{const o=ORD[qid]||[];return Array.isArray(v)?v.map(i=>o[i]).sort((a,b)=>a-b):o[v]};
const toDisplay =(qid,v)=>{const o=ORD[qid]||[];return (Array.isArray(v)?v:[v]).map(a=>o.indexOf(a))};

/* 考试抽题：按「篇章 × KSA」轮转均摊，保证不整块漏掉 */
function sampleQs(list){
  const target=examN(list.length), bucket={};
  list.forEach(q=>{const k=q.chapter+'|'+q.ksa;(bucket[k]=bucket[k]||[]).push(q)});
  const keys=Object.keys(bucket); keys.forEach(k=>bucket[k]=shuffle(bucket[k]));
  const out=[]; let i=0;
  while(out.length<target && i<keys.length*400){
    const b=bucket[keys[i%keys.length]]; if(b.length) out.push(b.pop());
    i++;
  }
  return out;
}

$('#start').onclick=()=>{
  if(!sel) return;
  QS=prep(MODE==='exam'?sampleQs(poolOf()):poolOf());
  picked={}; graded={};
  $('#hero').classList.add('hide'); $('#bar').classList.remove('hide'); $('#foot').classList.remove('hide');
  render(); window.scrollTo(0,0);
  if(window.habTrack) habTrack('quiz_start',{extra:{mode:MODE,chapter:sel,n:QS.length}});
};

/* ══════════ 渲染 ══════════ */
function render(){
  $('#body').innerHTML=QS.map((q,i)=>{
    const multi=q.type==='multi', cur=picked[q.id];
    const opts=q.opts.map((o,j)=>{
      const on=multi?(cur||[]).includes(j):cur===j;
      return `<label class="opt ${on?'sel':''}" data-q="${q.id}" data-o="${j}">
        <input type="${multi?'checkbox':'radio'}" name="${q.id}" ${on?'checked':''}>
        <span class="L">${q.type==='judge'?'':L[j]+'.'}</span><span>${o}</span></label>`;
    }).join('');
    return `<div class="q" id="q-${q.id}">
      <div class="qh"><span class="no">${String(i+1).padStart(2,'0')}</span>
        <span class="tag t-${q.ksa}">${q.ksa}</span>
        <span class="ty">${TY[q.type]}${multi?' · 可多选':''}</span></div>
      <div class="qt">${q.q}</div>
      <div class="opts">${opts}</div>
      ${(MODE==='drill'&&multi&&!graded[q.id])?`<button class="btn drill-x dg" data-q="${q.id}">确认这题</button>`:''}
      <div class="rpwrap" id="rpw-${q.id}"></div></div>`;
  }).join('');

  $('#body').querySelectorAll('.opt').forEach(el=>el.onclick=e=>{
    e.preventDefault();
    const qid=el.dataset.q, o=+el.dataset.o, q=QS.find(x=>x.id===qid);
    if(graded[qid]) return;
    if(q.type==='multi'){
      const a=new Set(picked[qid]||[]); a.has(o)?a.delete(o):a.add(o);
      picked[qid]=[...a].sort((x,y)=>x-y); if(!picked[qid].length) delete picked[qid];
    }else picked[qid]=o;
    render();
    if(MODE==='drill'&&q.type!=='multi') gradeOne(qid);
  });
  $('#body').querySelectorAll('.dg').forEach(el=>el.onclick=()=>gradeOne(el.dataset.q));
  Object.keys(graded).forEach(qid=>paint(qid,graded[qid]));
  prog();
}

function prog(){
  const n=Object.keys(picked).length, g=Object.keys(graded).length, t=QS.length;
  const done = MODE==='drill' ? g : n;
  $('#pb').style.width=(t?done/t*100:0)+'%'; $('#pn').textContent=`${done} / ${t}`;
  if(MODE==='drill'){
    $('#submit').disabled=g<t; $('#submit').textContent='看整体得分';
    $('#left').textContent=g<t?`已判 ${g} / ${t} 题 —— 每题选完立刻出解析`:'全部判完，看看三类得分';
  }else{
    $('#submit').disabled=n<t; $('#submit').textContent='交卷看结果';
    $('#left').textContent=n<t?`还有 ${t-n} 题未作答`:'全部答完，可以交卷了';
  }
}

/* ══════════ 判分与解析 ══════════ */
async function post(answers){
  return (await (await fetch(API+'/api/quiz/submit',{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({answers})})).json());
}
async function gradeOne(qid){
  if(graded[qid]||picked[qid]===undefined) return;
  try{
    const r=await post({[qid]:toOriginal(qid,picked[qid])});
    graded[qid]=r.details[0]; paint(qid,graded[qid]); prog();
  }catch(e){}
}
function paint(qid,d){
  const el=$('#q-'+qid); if(!el) return;
  const ansDisp=toDisplay(qid,d.ans);
  const mine=picked[qid], my=Array.isArray(mine)?mine:[mine];
  el.querySelectorAll('.opt').forEach((o,j)=>{
    o.style.cursor='default'; o.classList.remove('sel');
    if(ansDisp.includes(j)) o.classList.add(my.includes(j)?'right':'miss');
    else if(my.includes(j)) o.classList.add('wrong');
  });
  const dg=el.querySelector('.dg'); if(dg) dg.remove();
  if(!el.querySelector('.expl')){
    el.querySelector('.rpwrap').insertAdjacentHTML('beforebegin',
      `<div class="vd ${d.correct?'ok':'no'}">${d.correct?'✓ 答对了':'✗ 答错了'}</div>
       <div class="ansline">正确答案：${ansDisp.map(j=>'「'+el.querySelectorAll('.opt')[j].textContent.trim()+'」').join('　')}</div>
       <div class="expl">${d.exp}</div>
       <span class="rp" data-q="${qid}">这道题有问题？点这里报错</span>`);
    el.querySelector('.rp').onclick=()=>openReport(qid);
  }
}

/* 题库一定会有错题，唯一能发现的人是做题的人。没有这个入口，错题就永远在那里。 */
function openReport(qid){
  const box=$('#rpw-'+qid); if(!box||box.dataset.open) return;
  box.dataset.open='1';
  box.innerHTML=`<div class="rpbox">
    <textarea placeholder="哪里有问题？比如：选项 B 和 C 意思重复、答案应该是 A、题干有歧义…"></textarea>
    <div class="row"><button class="btn" data-a="send">提交</button>
      <button class="btn" data-a="cancel">取消</button><span class="msg"></span></div></div>`;
  const ta=box.querySelector('textarea'), msg=box.querySelector('.msg');
  box.querySelector('[data-a=cancel]').onclick=()=>{box.innerHTML='';delete box.dataset.open};
  box.querySelector('[data-a=send]').onclick=async()=>{
    const v=ta.value.trim();
    if(v.length<4){msg.textContent='说具体一点吧';msg.style.color='var(--danger)';return}
    try{
      const r=await fetch(API+'/api/quiz/report',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({question_id:qid,reason:v})});
      if(!r.ok) throw 0;
      box.innerHTML='<div style="font-size:12px;color:var(--green-d);padding:6px 0">✓ 已收到，我们会核对这道题。谢谢你帮忙纠错。</div>';
      if(window.habTrack) habTrack('quiz_report',{extra:{qid}});
    }catch(e){msg.textContent='提交失败，稍后再试';msg.style.color='var(--danger)'}
  };
}

/* ══════════ 交卷 ══════════ */
$('#submit').onclick=async()=>{
  $('#submit').disabled=true; $('#submit').textContent='判分中…';
  let r;
  try{ r=await post(Object.fromEntries(Object.entries(picked).map(([k,v])=>[k,toOriginal(k,v)]))); }
  catch(e){ $('#submit').textContent='判分失败，重试'; $('#submit').disabled=false; return; }

  const NAME={K:'K · 知识',S:'S · 技能',A:'A · 能力'};
  const COLOR={K:'#1F55E0',S:'#00A88A',A:'#7C3AED'};
  const md=t=>t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  $('#results').innerHTML=
    `<h2 style="font-size:24px;margin-bottom:6px">你的三类得分</h2><div class="note">${r.note}</div>`
    + ['K','S','A'].filter(k=>r.scores[k]).map(k=>{
        const v=r.scores[k], pc=Math.round(v.rate*100);
        const c = v.rate>=.9?'#00A88A' : v.rate>=.7?'#3370FF' : v.rate>=.4?'#D97706':'#DC2626';
        return `<div class="rc">
          <div class="top"><div><span class="nm">${NAME[k]}</span>
            <span class="lv" style="color:${c};background:${c}1a">${v.level}</span></div>
            <div class="sc" style="color:${COLOR[k]}">${v.correct}<span style="font-size:14px;color:var(--faint)">/${v.total}</span></div></div>
          <div class="rb"><i style="width:${pc}%;background:${COLOR[k]}"></i></div>
          <div class="ad">${md(v.advice)}</div></div>`;
      }).join('')
    + `<div style="margin:22px 0 8px"><h3 style="font-size:17px">逐题解析</h3></div>`;

  const by={}; r.details.forEach(d=>by[d.id]=d);
  QS.forEach(q=>{ if(by[q.id]){ graded[q.id]=by[q.id]; paint(q.id,by[q.id]); } });

  $('#results').insertAdjacentHTML('beforeend',
    `<div style="text-align:center;margin-top:30px">
       <button class="btn lg" onclick="location.reload()">再测一次</button>
       <a class="btn lg" href="learn.html" style="margin-left:8px">回去补课</a></div>`);
  $('#results').classList.remove('hide');
  $('#foot').classList.add('hide');
  $('#results').scrollIntoView({behavior:'smooth'});
  if(window.habTrack) habTrack('quiz_submit',{extra:{mode:MODE,chapter:sel,
    scores:Object.fromEntries(Object.entries(r.scores).map(([k,v])=>[k,v.rate]))}});
};
</script>
<script src="track.js"></script>
<script src="sparky.js" defer></script>

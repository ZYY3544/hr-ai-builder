<script>if(location.hostname==='hr-ai-builder-web.onrender.com'){var _m='';try{var _t=localStorage.getItem('hab_token');if(_t){_m='#mig='+encodeURIComponent(JSON.stringify({t:_t,u:localStorage.getItem('hab_user')||'',d:localStorage.getItem('hab_done')||'',b:localStorage.getItem('hab_quiz_best')||'',w:localStorage.getItem('hab_wrong')||'',h:location.hash||''}));}}catch(e){}location.replace('https://learning.meansights.com'+location.pathname+location.search+(_m||location.hash));}else if(location.hash.indexOf('#mig=')===0){try{var _p=JSON.parse(decodeURIComponent(location.hash.slice(5)));if(_p&&_p.t&&!localStorage.getItem('hab_token')){localStorage.setItem('hab_token',_p.t);if(_p.u)localStorage.setItem('hab_user',_p.u);if(_p.d)localStorage.setItem('hab_done',_p.d);if(_p.b)localStorage.setItem('hab_quiz_best',_p.b);if(_p.w)localStorage.setItem('hab_wrong',_p.w);}history.replaceState(null,'',location.pathname+location.search+((_p&&_p.h)||''));}catch(e){}}</script>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>岗位库 · JD × 能力 × 对应课程 · meansights learning</title>
<meta name="description" content="真实在招岗位的 JD 逐条拆解：这个岗位要哪些能力（K/S/A）、每项能力去学哪几节课。">
<style>
:root{
  --pri:#00A88A; --pri-d:#00876F; --pri-s:#E8FBF6;
  --blue:#3370FF; --blue-d:#1F55E0; --blue-s:#EEF3FF;
  --violet:#7C3AED; --violet-s:#F5EFFF;
  --grad-r:linear-gradient(135deg,#00A88A,#0891B2);
  --ink:#0F172A; --body:#475569; --muted:#64748B; --faint:#94A3B8;
  --line:#E2E8F0; --line-soft:#F1F5F9; --bg:#F8FAFC;
  --must:#DC2626; --plus:#D97706;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font:13px/1.7 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC',sans-serif;
  color:var(--body);background:#fff;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden}
a{color:inherit;text-decoration:none}
h1,h2,h3{color:var(--ink);font-weight:600;letter-spacing:-.02em}

/* ── 顶栏 ── */
.top{flex:0 0 auto;border-bottom:1px solid var(--line);background:#fff;z-index:20}
.mark{height:25px;width:auto;display:block}
.top .sp{flex:1}
.stat{display:flex;gap:14px;font-size:12px;color:var(--faint);padding:12px 14px 2px}
.stat b{color:var(--ink);font-weight:600;margin-right:3px}
.stat b{color:var(--ink);font-size:15px;font-weight:600;margin-right:3px;font-variant-numeric:tabular-nums}
.tbtn{font:inherit;font-size:12.5px;padding:6px 13px;border-radius:6px;border:1px solid var(--line);
  background:#fff;color:var(--body);white-space:nowrap}
.tbtn:hover{border-color:var(--pri);color:var(--pri)}
@media(max-width:900px){.stat{display:none}}

/* ── 三栏 ── */
.main{flex:1;display:flex;min-height:0}
.col{display:flex;flex-direction:column;min-height:0}
.left{width:290px;flex:0 0 auto;border-right:1px solid var(--line);background:var(--bg)}
.mid{flex:1;min-width:0;overflow-y:auto}
.right{width:352px;flex:0 0 auto;border-left:1px solid var(--line);background:var(--bg);overflow-y:auto}
@media(max-width:1180px){.right{display:none}}
@media(max-width:820px){.left{display:none}}

/* 左栏 */
.srch{padding:13px 14px 10px;flex:0 0 auto}
.srch input{width:100%;font:inherit;font-size:12.5px;padding:8px 12px;border:1px solid var(--line);
  -webkit-appearance:none;appearance:none;
  border-radius:8px;background:#fff;color:var(--ink)}
.srch input:focus{outline:none;border-color:var(--pri)}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.cnt{padding:0 16px 10px;font-size:11.5px;color:var(--faint);flex:0 0 auto}
.list{flex:1;overflow-y:auto;padding:0 8px 24px}
.jc{padding:12px 12px;border-radius:9px;cursor:pointer;margin-bottom:2px;transition:.13s}
.jc:hover{background:#fff}
.jc.on{background:#fff;box-shadow:inset 3px 0 0 var(--pri),0 1px 6px rgba(15,23,42,.06)}
.jc .co{font-size:11.5px;color:var(--muted)}
.jc .ti{font-size:13.5px;font-weight:600;color:var(--ink);margin:2px 0 6px;line-height:1.42}
.jc .m{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--faint)}
.chip{border:1px solid var(--line);border-radius:4px;padding:1px 6px;background:#fff}
.jc .n{margin-left:auto;color:var(--pri);font-weight:600}

/* 中栏 */
.mid-in{max-width:760px;padding:30px 40px 70px}
.d-co{font-size:12.5px;color:var(--muted)}
.d-ti{font-size:26px;letter-spacing:-.028em;margin:5px 0 12px;line-height:1.3}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}
.pill{font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:3px 9px;color:var(--muted)}
.pill.ok{border-color:#A7F3D0;background:var(--pri-s);color:var(--pri-d)}
.pill.warn{border-color:#FDE68A;background:#FFFBEB;color:#92400E}
.sec{margin-top:32px}
.sec-h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.sec-h .no{background:var(--pri);color:#fff;border-radius:4px;padding:0 6px;letter-spacing:0;font-size:10.5px}
.sec-h em{font-style:normal;text-transform:none;letter-spacing:0;color:var(--muted);margin-left:auto;font-size:11.5px}
/* 组织意图：这条 JD 里我们读出了什么。是岗位库跟直接看招聘网站的唯一区别，
   所以放在 JD 正文之前——先给判断，再给原文。 */
.moat{background:var(--pri-s);border-left:3px solid var(--pri);border-radius:0 9px 9px 0;
  padding:15px 18px;font-size:14px;line-height:1.9;color:var(--ink);margin:22px 0 4px}
.moat-t{display:block;font-size:10.5px;font-weight:700;letter-spacing:.1em;
  color:var(--pri-d);margin-bottom:6px}
.jdbox{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:16px 18px;
  font-size:13.5px;color:var(--muted);line-height:1.95}
.jdbox .ph{color:var(--faint);font-style:italic}
.pay{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line-soft);
  border:1px solid var(--line-soft);border-radius:10px;overflow:hidden}
.pay div{background:#fff;padding:13px 15px}
.pay .k{font-size:10.5px;color:var(--faint);letter-spacing:.05em}
.pay .v{font-size:15px;font-weight:600;color:var(--ink);margin-top:3px}
.pay .v small{font-size:12px;font-weight:400;color:var(--muted)}
.qs{list-style:none}
.qs li{padding:10px 0 10px 22px;border-bottom:1px solid var(--line-soft);font-size:14px;
  position:relative;line-height:1.75}
.qs li:last-child{border-bottom:0}
.qs li:before{content:"Q";position:absolute;left:0;top:11px;font-size:10.5px;font-weight:700;color:var(--must)}

/* 右栏 */
.r-in{padding:22px 20px 60px}
.r-h{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.r-sub{font-size:12px;color:var(--muted);line-height:1.75;margin-bottom:16px}
.grp{margin-bottom:22px}
.grp-t{font-size:11.5px;font-weight:700;letter-spacing:.06em;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.grp-t .b{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;color:#fff}
.b-must{background:var(--must)} .b-plus{background:var(--plus)}
.cap{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px 15px;margin-bottom:9px}
.cap .n{font-size:13.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:7px}
.ksa{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;color:#fff;flex:0 0 auto}
.k-K{background:var(--blue)} .k-S{background:var(--pri)} .k-A{background:var(--violet)}
.cap .why{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.75}
.cap .ls{margin-top:11px;padding-top:10px;border-top:1px solid var(--line-soft)}
.cap .ls .lb{font-size:10.5px;color:var(--faint);letter-spacing:.05em;margin-bottom:5px}
.cap a.l{display:flex;gap:7px;align-items:flex-start;padding:5px 7px;margin:0 -7px;border-radius:6px;
  font-size:12.5px;color:var(--body);line-height:1.55;transition:.12s}
.cap a.l:hover{background:var(--pri-s);color:var(--pri-d)}
.cap a.l:before{content:"›";color:var(--faint);font-weight:700}
.cap a.l .lk{font-size:9px;opacity:.5;margin-left:3px}

.coachin{margin-top:22px;border:1.5px solid rgba(0,168,138,.4);border-radius:12px;padding:15px 17px;
  background:linear-gradient(135deg,rgba(0,168,138,.05),rgba(8,145,178,.05))}
.coachin .t{font-size:13.5px;font-weight:600;color:var(--ink)}
.coachin .d{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.8}
.coachin a{display:inline-block;margin-top:9px;font-size:12.5px;font-weight:600;color:var(--pri-d)}
.coachin a:hover{text-decoration:underline}
.databar{background:#FFFBEB;border:1px solid #FDE68A;border-radius:9px;padding:11px 14px;
  font-size:11.5px;color:#78350F;line-height:1.8;margin-top:26px}
.databar b{font-weight:600}
.load{padding:60px 20px;text-align:center;color:var(--faint);font-size:13px}
/* 全站统一导航（与首页一致，便于任意页之间跳转） */
/* ── 全站统一顶栏（数值照抄首页，改这里前先对 index.html） ── */
.gwrap{max-width:1400px;margin:0 auto;padding:0 40px;display:flex;align-items:center;gap:24px;height:60px}
.brand{display:flex;align-items:center;flex:0 0 auto;margin-left:-42px;transition:opacity .15s}
.brand:hover{opacity:.72}
.glinks{display:flex;align-items:center;justify-content:flex-end;gap:20px;flex:1;position:relative;top:5.87px}
.glinks a{font-size:14px;font-weight:600;color:var(--muted);padding:6px 12px;border-radius:6px;line-height:1.2;transition:.15s}
.glinks a:hover{color:var(--pri);background:rgba(0,168,138,.07)}
.glinks a.cur{color:var(--pri)}
.gright{display:flex;align-items:center;gap:9px;flex:0 0 auto;position:relative;top:5.87px;margin-right:-14px}
.gbtn{font-size:12.5px;font-weight:500;padding:6.5px 14px;border-radius:6px;color:#fff;white-space:nowrap;
  background:linear-gradient(135deg,#00A88A,#0891B2);box-shadow:0 3px 12px -3px rgba(0,168,138,.6)}
.uava{width:30px;height:30px;border-radius:50%;display:block;overflow:hidden;padding:0;
  border:1.5px solid #E2E8F0;box-shadow:none;background:#fff;cursor:pointer}
.uava:hover{border-color:#00A88A}
.uava img{width:100%;height:100%;object-fit:cover;display:block}
.uava .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;color:#fff;background:linear-gradient(135deg,#00A88A,#0891B2)}
.uava .ph svg{width:15px;height:15px}
@media(max-width:1402px){.brand{margin-left:0}}
/* 窗口收窄时导航同步收紧:六个 tab 在 960-1250 区间字号与间距两档降,960 以下才隐藏 */
@media(max-width:1250px){.glinks{gap:8px}.glinks a{font-size:13px;padding:6px 8px}}
@media(max-width:1080px){.glinks{gap:2px}.glinks a{font-size:12.5px;padding:6px 6px;letter-spacing:0}}
@media(max-width:960px){.glinks{display:none}}

/* ── JD 视图（参考 Kimi 岗位页形态） ── */
.d-co .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pri);margin-right:8px;vertical-align:1px}
.jdhead{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}
.jdlabel{font-size:13px;font-weight:700;color:var(--ink)}
.legend{font-size:11.5px;color:var(--faint)}
.jdtext{font-size:14px;line-height:2.1;white-space:pre-wrap;color:var(--body)}
mark.kw{background:rgba(0,168,138,.13);color:inherit;border-radius:3px;padding:1px 3px;
  border-bottom:2px solid rgba(0,168,138,.45);cursor:default}
mark.kw:hover{background:rgba(0,168,138,.22)}
mark.kw.demo{cursor:default;font-size:11px}
.applybtn{display:inline-flex;align-items:center;gap:8px;margin-top:26px;font-size:14px;font-weight:600;
  color:#fff;background:linear-gradient(135deg,#00A88A,#0891B2);border-radius:12px;padding:12px 26px;
  box-shadow:0 6px 20px -6px rgba(0,168,138,.55);transition:.15s}
.applybtn:hover{transform:translateY(-1px);box-shadow:0 10px 26px -6px rgba(0,168,138,.65);color:#fff}
.cap.lit{border-color:var(--pri);box-shadow:0 0 0 2px rgba(0,168,138,.15)}
</style>
</head>

    <a class="brand" href="index.html"><picture><source media="(max-width:1100px)" srcset="brand/lockup.svg"><img class="mark" src="brand/lockup-product.svg" alt="meansights — HR AI Learning Agent"></picture></a>

</div></div>
<script>/* 防闪：顶栏一画出来就用缓存身份换掉"登录"，网络校验在页尾脚本 */
(function(){try{var u=JSON.parse(localStorage.getItem('hab_user')||'null');
if(u&&localStorage.getItem('hab_token')){var b=document.getElementById('loginBtn');
b.className='uava';b.title=(u.nickname||'')+' · 账户';
b.innerHTML=u.avatar?'<img src="'+u.avatar+'" alt="">':'<span class="ph">'+(u.nickname||'我')[0]+'</span>';
b.setAttribute('href','javascript:void(0)');}}catch(e){}})();
</script>

<div class="main">
  <aside class="col left">
    <div class="stat"><span><b id="sN">–</b>岗位</span><span><b id="sC">–</b>公司</span><span><b id="sL">–</b>可对应课程</span></div>
    <div class="srch"><input id="q" type="search" name="job-search" placeholder="搜岗位名 / 公司" autocomplete="off" autocorrect="off" spellcheck="false" data-1p-ignore data-lpignore="true" data-bwignore data-form-type="other"></div>
    <div class="cnt" id="cnt"></div>
    <div class="list" id="list"></div>
  </aside>

  <div class="col mid"><div class="mid-in" id="detail"><div class="load">加载中…</div></div></div>

  <aside class="col right"><div class="r-in" id="caps"></div></aside>
</div>

<script>
/* 强制登录：岗位库是花时间整理的资产,只对登录用户开放（免费,微信扫码一步） */
if(!localStorage.getItem('hab_token')){
  try{ sessionStorage.setItem('hab_next','jobs.html'+location.hash); }catch(e){}
  location.replace('index.html#login');
}
const API=(location.hostname==='localhost'||location.protocol==='file:')
  ? 'http://localhost:8001' : 'https://hr-ai-builder-api.onrender.com';
const $=s=>document.querySelector(s);
let JOBS=[], cur=null, kw='';

(async function(){
  try{
    const d=await (await fetch(API+'/api/jobs')).json();
    JOBS=d.items;
    $('#sN').textContent=JOBS.length;
    $('#sC').textContent=new Set(JOBS.map(j=>j.company.split(' · ')[0])).size;
    renderList();
    pick(location.hash.replace('#','')||JOBS[0].id);
  }catch(e){
    $('#detail').innerHTML='<div class="load">岗位服务暂时不可用，请稍后重试。</div>';
  }
})();

/* 侧栏是平铺清单。岗位记录里仍带 track（技术侧长过来 / HR 侧长出来 / 老岗位被重估），
   那是入库时的判据，留着备用，但不往界面上摆——分类名不够典型，写出来反而添噪。 */
function renderList(){
  const l=JOBS.filter(j=>!kw || (j.title+j.company+j.location).toLowerCase().includes(kw));
  $('#cnt').textContent=`共 ${l.length} 个岗位`;
  $('#list').innerHTML=l.map(j=>`
    <div class="jc ${j.id===cur?'on':''}" data-id="${j.id}">
      <div class="co">${j.company}</div>
      <div class="ti">${j.title}</div>
      <div class="m"><span class="chip">${j.type}</span><span>${j.location}</span>
        <span class="n">${j.must.length} 项硬门槛</span></div>
    </div>`).join('') || '<div class="load">没有匹配的岗位</div>';
  $('#list').querySelectorAll('.jc').forEach(el=>el.onclick=()=>pick(el.dataset.id));
}
$('#q').oninput=e=>{kw=e.target.value.trim().toLowerCase(); renderList();};

async function pick(id){
  if(!JOBS.some(j=>j.id===id)) id=JOBS[0].id;
  cur=id; history.replaceState(null,'','#'+id); renderList();
  $('#detail').innerHTML='<div class="load">加载中…</div>'; $('#caps').innerHTML='';
  let j;
  try{ j=await (await fetch(API+'/api/jobs/'+id)).json(); }
  catch(e){ $('#detail').innerHTML='<div class="load">读取失败</div>'; return; }
  document.title=`${j.title} · 岗位库 · meansights learning`;
  renderDetail(j); renderCaps(j);
  if(window.habTrack) habTrack('job_view',{extra:{id}});
}

function renderDetail(j){
  // JD 原文 + 命中词底纹 + 官网投递。命中词悬停时右栏对应能力卡点亮。
  function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  function hlJD(text, hl){
    let out = esc(text);
    // 长词先标，避免短词是长词子串时把标注拆坏
    for(const kw of Object.keys(hl||{}).sort((a,b)=>b.length-a.length)){
      out = out.split(esc(kw)).join(`<mark class="kw" data-term="${hl[kw]}">${esc(kw)}</mark>`);
    }
    return out;
  }
  const kindNote = j.jd_kind==='full'    ? '官方 JD 原文'
                 : j.jd_kind==='excerpt' ? 'JD 摘录 · 完整版见官网'
                 : j.jd_kind==='brief'   ? '官方方向说明 · 完整 JD 见官网' : '';
  $('#detail').innerHTML=`
   <div class="d-co"><span class="dot"></span>${j.company}</div>
   <h1 class="d-ti">${j.title}</h1>
   <div class="pills"><span class="pill">${j.type}</span><span class="pill">${j.location}</span>
     <span class="pill ok">岗位已核实</span>${kindNote?`<span class="pill">${kindNote}</span>`:''}</div>

   ${j.intent?`<div class="moat"><span class="moat-t">这条 JD 里值得看的地方</span>${j.intent}</div>`:''}

   <div class="jdhead"><span class="jdlabel">岗位 JD</span>
     <span class="legend"><mark class="kw demo">底纹</mark> 处为命中的能力关键词，对应右栏</span></div>
   ${j.jd_text
     ? `<div class="jdtext">${hlJD(j.jd_text, j.hl)}</div>`
     : `<div class="jdbox"><span class="ph">— JD 正文尚未取到，以官网为准 —</span></div>`}

   ${j.apply_url ? `<a class="applybtn" href="${j.apply_url}" target="_blank" rel="noopener">前往官网投递 <span>↗</span></a>` : ''}`;

  // 命中词 ↔ 右栏能力卡联动
  document.querySelectorAll('#detail .kw[data-term]').forEach(el=>{
    el.onmouseenter=()=>{const c=document.getElementById('cap-'+el.dataset.term);
      if(c){c.classList.add('lit');c.scrollIntoView({block:'nearest',behavior:'smooth'});}};
    el.onmouseleave=()=>{const c=document.getElementById('cap-'+el.dataset.term);
      if(c)c.classList.remove('lit');};
  });
}


function renderCaps(j){
  const kp=(t)=>`
    <div class="cap" id="cap-${t.id}">

         +(j.plus_detail||[]).reduce((a,t)=>a+(t.lessons||[]).length,0);

/* 登录后右上角=头像账户菜单（track.js 全站接管） */
(async function(){
  var t=localStorage.getItem('hab_token'); if(!t) return;
  var lb=document.getElementById('loginBtn');
  var show=function(u){ lb.className='uava'; lb.title=(u.nickname||'')+' · 账户';
      lb.innerHTML=u.avatar?'<img src="'+u.avatar+'" alt="">':'<span class="ph">'+(u.nickname||'我')[0]+'</span>';
      lb.href='javascript:void(0)'; lb.onclick=null; };
  try{ var c=JSON.parse(localStorage.getItem('hab_user')||'null'); if(c) show(c); }catch(e){}  /* 同步先画缓存,不闪"登录" */
  try{
    var r=await fetch('https://hr-ai-builder-api.onrender.com/api/me',{headers:{Authorization:'Bearer '+t}});
    if(!r.ok){ if(r.status===401){ localStorage.removeItem('hab_token'); localStorage.removeItem('hab_user'); } return; }
    var u=await r.json();
    localStorage.setItem('hab_user',JSON.stringify({nickname:u.nickname,avatar:u.avatar}));
    show(u);
  }catch(e){}
})();

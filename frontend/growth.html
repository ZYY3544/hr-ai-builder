<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
<link rel="icon" href="favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<link rel="alternate icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>我的成长 · meansights learning</title>
<meta name="robots" content="noindex">
<style>
:root{
  --blue:#3370FF; --blue-d:#1F55E0; --blue-l:#5B8CFF; --blue-s:#EEF3FF;
  --pri:#00A88A; --pri-d:#00876F; --pri-s:#E8FBF6;
  --violet:#7C3AED; --violet-l:#9B6BFF; --violet-s:#F5EFFF;
  --green:#00C6A2; --green-d:#00A88A; --green-l:#2AE0BE; --green-s:#E8FBF6;
  --grad:linear-gradient(100deg,#3370FF 0%,#0891B2 45%,#00A88A 100%);
  --grad-r:linear-gradient(135deg,#00A88A,#0891B2);
  --ink:#0F172A; --body:#475569; --muted:#64748B; --faint:#94A3B8;
  --line:#E2E8F0; --line-soft:#F1F5F9; --bg:#F8FAFC;
  --ok:#00A88A; --danger:#DC2626;
  --r-s:6px; --r:10px; --r-l:14px; --r-x:20px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font:13px/1.7 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC',sans-serif;
  color:var(--body);background:#fff;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
h1,h2,h3{color:var(--ink);font-weight:600;letter-spacing:-.02em;line-height:1.35}
.wrap{max-width:1080px;margin:0 auto;padding:0 40px}
@media(max-width:640px){.wrap{padding:0 20px}}

/* ---------- 统一导航（与全站 byte-identical）---------- */
header{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.82);
  backdrop-filter:saturate(1.8) blur(14px);border-bottom:1px solid rgba(226,232,240,.9)}
.mark{height:25px;width:auto;display:block}
.gwrap{max-width:1400px;margin:0 auto;padding:0 40px;display:flex;align-items:center;gap:24px;height:60px}
.brand{display:flex;align-items:center;flex:0 0 auto;margin-left:-42px;transition:opacity .15s}
.brand:hover{opacity:.72}
.glinks{display:flex;align-items:center;justify-content:flex-end;gap:20px;flex:1;position:relative;top:5.87px}
.glinks a{font-size:14px;font-weight:600;color:var(--muted);padding:6px 12px;border-radius:6px;line-height:1.2;transition:.15s}
.glinks a:hover{color:var(--pri);background:rgba(0,168,138,.07)}
.glinks a.cur{color:var(--pri)}
.gright{display:flex;align-items:center;gap:9px;flex:0 0 auto;position:relative;top:5.87px;margin-right:-14px}
.gbtn{font-size:12.5px;font-weight:500;padding:6.5px 14px;border-radius:6px;color:#fff;white-space:nowrap;
  background:linear-gradient(135deg,#00A88A,#0891B2);box-shadow:0 3px 12px -3px rgba(0,168,138,.6)}
.uava{width:30px;height:30px;border-radius:50%;display:block;overflow:hidden;padding:0;
  border:1.5px solid #E2E8F0;box-shadow:none;background:#fff;cursor:pointer}
.uava:hover{border-color:#00A88A}
.uava img{width:100%;height:100%;object-fit:cover;display:block}
.uava .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;color:#fff;background:linear-gradient(135deg,#00A88A,#0891B2)}
.uava .ph svg{width:15px;height:15px}
@media(max-width:1402px){.brand{margin-left:0}}
@media(max-width:960px){.glinks{display:none}}

/* ---------- 页面 ---------- */
.pagehead{padding:52px 0 8px}
.pagehead h1{font-size:clamp(26px,3.4vw,36px)}
.pagehead .sub{margin-top:8px;font-size:13.5px;color:var(--muted)}
.note{margin:18px 0 0;padding:11px 16px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--bg);font-size:12.5px;color:var(--muted)}
.note b{color:var(--pri-d)}
section.blk{padding:34px 0 6px}
.blk h2{font-size:17px;margin-bottom:4px}
.blk .hint{font-size:12.5px;color:var(--faint);margin-bottom:18px}

/* 章节关卡 */
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.chc{position:relative;border:1px solid var(--line);border-radius:var(--r-l);padding:16px 18px 15px;
  background:#fff;transition:border-color .15s,box-shadow .15s;display:block}
.chc:hover{border-color:var(--pri);box-shadow:0 8px 24px -12px rgba(15,23,42,.18)}
.chc .num{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--faint)}
.chc .ti{font-size:14px;font-weight:600;color:var(--ink);margin:2px 0 10px}
.chc .row{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--muted)}
.chc .bar{flex:1;height:5px;border-radius:3px;background:var(--line-soft);overflow:hidden}
.chc .bar i{display:block;height:100%;background:var(--grad-r);border-radius:3px}
.chc .qrow{margin-top:8px}
.chc .qrow .go{color:var(--pri-d);font-weight:600}
.chc .qrow .go:hover{text-decoration:underline}
.badge{position:absolute;top:13px;right:14px;font-size:11px;font-weight:600;color:var(--pri-d);
  background:var(--pri-s);border:1px solid rgba(0,168,138,.35);border-radius:99px;padding:2px 9px}

/* 战役 */
.tkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tkc{border:1px solid var(--line);border-radius:var(--r-l);padding:16px 18px;background:#fff}
.tkc .ti{font-size:14px;font-weight:600;color:var(--ink)}
.tkc .st{display:inline-block;margin:8px 0 10px;font-size:11px;font-weight:600;border-radius:99px;padding:2px 10px}
.st.s0{color:var(--faint);background:var(--line-soft)}
.st.s1{color:#92400E;background:#FEF3C7}
.st.s2{color:var(--pri-d);background:var(--pri-s)}
.tkc .ops{display:flex;gap:10px;align-items:center;font-size:12px}
.tkc .ops a{color:var(--pri-d);font-weight:600}
.tkc .ops a:hover{text-decoration:underline}
.tkc .ops button{font:inherit;font-size:12px;font-weight:600;color:var(--pri-d);background:none;
  border:1px solid rgba(0,168,138,.4);border-radius:7px;padding:4px 11px;cursor:pointer}
.tkc .ops button:hover{background:var(--pri-s)}

/* 曲线 */
.curvebox{border:1px solid var(--line);border-radius:var(--r-l);padding:18px 20px;background:#fff}
.curvebox svg{width:100%;height:auto;display:block}
.empty{font-size:12.5px;color:var(--faint);padding:26px 0;text-align:center}

.foot{padding:44px 0 64px}
.logout{font:inherit;font-size:12.5px;color:var(--muted);background:none;border:1px solid var(--line);
  border-radius:8px;padding:7px 16px;cursor:pointer}
.logout:hover{border-color:var(--danger);color:var(--danger)}
</style>
</head>
<body>

<header>
  <div class="gwrap">
    <a class="brand" href="index.html" aria-label="回到首页"><picture><source media="(max-width:1100px)" srcset="brand/lockup.svg"><img class="mark" src="brand/lockup-product.svg" alt="meansights — HR AI Learning Agent"></picture></a>
    <div class="glinks">
      <a href="learn.html">课程内容</a>
      <a href="tasks.html">实战任务</a>
      <a href="jobs.html">岗位机会</a>
      <a href="about.html">关于我们</a>
    </div>
    <div class="gright"><a class="uava" href="index.html#login" id="loginBtn" title="登录"><span class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span></a></div>
  </div>
</header>
<script>/* 防闪：顶栏一画出来就用缓存身份换掉"登录" */
(function(){try{var u=JSON.parse(localStorage.getItem('hab_user')||'null');
if(u&&localStorage.getItem('hab_token')){var b=document.getElementById('loginBtn');
b.className='uava';b.title=u.nickname||'';
b.innerHTML=u.avatar?'<img src="'+u.avatar+'" alt="">':'<span class="ph">'+(u.nickname||'我')[0]+'</span>';
b.removeAttribute('href');}}catch(e){}})();
</script>

<div class="wrap">
  <div class="pagehead">
    <h1>我的成长</h1>
    <div class="sub">每个点亮都是测出来的，不是点出来的——通关靠答对题，S 靠真做完战役。</div>
  </div>

  <section class="blk">
    <h2>章节关卡</h2>
    <div class="hint">每章读完去打「本章小测」，答对 70% 点亮这一章。</div>
    <div class="chgrid" id="chgrid"></div>
  </section>

  <section class="blk">
    <h2>实战战役</h2>
    <div class="hint">下载任务包、在你自己的电脑上做完、对过答案卡，回来把它标成已完成。</div>
    <div class="tkgrid" id="tkgrid"></div>
  </section>

  <section class="blk">
    <h2>成绩曲线</h2>
    <div class="hint">每次本章小测的正确率，按时间排——曲线抖不可怕，掉头向上就对了。</div>
    <div class="curvebox" id="curvebox"></div>
  </section>

  <div class="foot"><button class="logout" id="logoutBtn" style="display:none">退出登录</button></div>
</div>

<script src="course-data.js"></script>
<script>
const $=s=>document.querySelector(s);
const CO=window.COURSE||{parts:[]};
const TK='hab_token';
const API=(location.hostname==='localhost'?'http://localhost:8001':'https://hr-ai-builder-api.onrender.com');
const QCH={'第零篇章':'p-zero','第一篇章':'p-1','第二篇章':'p-2','第三篇章':'p-3','第四篇章':'p-4',
           '第五篇章':'p-5','第六篇章':'p-6','第七篇章':'p-7','第八篇章':'p-8','第九篇章':'p-9'};
const TASKS=[
  {key:'monthly',  ti:'01 · 人力月报战役'},
  {key:'survey',   ti:'02 · 组织调研设计'},
  {key:'interview',ti:'03 · 面试官的一小时'},
];

const done=new Set(JSON.parse(localStorage.getItem('hab_done')||'[]'));
const best=JSON.parse(localStorage.getItem('hab_quiz_best')||'{}');
let attempts=JSON.parse(localStorage.getItem('hab_quiz_local')||'[]')
  .map(a=>({chapter:a.ch,correct:a.correct,n:a.n,ts:a.ts}));
let taskSt={}, logged=false;

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function renderChapters(){
  $('#chgrid').innerHTML=CO.parts.map(p=>{
    const ch=QCH[p.num]||'';
    const lessons=[]; p.topics.forEach(t=>t.lessons.forEach(l=>l.ready&&lessons.push(l)));
    const dn=lessons.filter(l=>done.has(l.file)).length;
    const b=best[ch]||0, pass=b>=0.7;
    const firstUnread=(lessons.find(l=>!done.has(l.file))||lessons[0]||{}).file||'';
    return `<a class="chc" href="learn.html#${encodeURIComponent(firstUnread)}">
      ${pass?'<span class="badge">已通关 ✓</span>':''}
      <div class="num">${esc(p.num)}</div><div class="ti">${esc(p.title)}</div>
      <div class="row"><span>读了 ${dn}/${lessons.length}</span><span class="bar"><i style="width:${lessons.length?dn/lessons.length*100:0}%"></i></span></div>
      <div class="row qrow"><span>小测最好 ${b>0?Math.round(b*100)+'%':'—'}</span>
        <span style="flex:1"></span><span class="go" data-q="${ch}">去打小测 →</span></div>
    </a>`;
  }).join('');
  document.querySelectorAll('.chc .go').forEach(g=>g.onclick=e=>{
    e.preventDefault(); e.stopPropagation(); location.href='learn.html#quiz:'+g.dataset.q; });
}

function renderTasks(){
  const ST={'':['s0','未开始'],downloaded:['s1','已领任务包'],done:['s2','已完成 ✓']};
  $('#tkgrid').innerHTML=TASKS.map(t=>{
    const s=ST[taskSt[t.key]||'']||ST[''];
    const markable=logged&&(taskSt[t.key]||'')!=='done';
    return `<div class="tkc"><div class="ti">${esc(t.ti)}</div>
      <span class="st ${s[0]}">${s[1]}</span>
      <div class="ops"><a href="tasks.html">去看任务 →</a>
        ${markable?`<button data-k="${t.key}">做完了，标记完成</button>`:''}</div></div>`;
  }).join('');
  document.querySelectorAll('.tkc button').forEach(b=>b.onclick=async()=>{
    b.disabled=true;
    try{ await fetch(API+'/api/progress',{method:'POST',
      headers:{'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem(TK)},
      body:JSON.stringify({kind:'task',key:b.dataset.k,value:{status:'done'}})});
      taskSt[b.dataset.k]='done'; renderTasks(); }catch(e){ b.disabled=false; }
  });
}

function renderCurve(){
  const box=$('#curvebox');
  const pts=attempts.filter(a=>a.n>0).map(a=>({...a,pct:a.correct/a.n}));
  if(!pts.length){ box.innerHTML='<div class="empty">还没有小测记录——去课程内容里打一章「本章小测」，第一个点就有了。</div>'; return; }
  const W=720,H=210,L=38,R=14,T=16,B=30;
  const x=i=>pts.length>1?L+(W-L-R)*i/(pts.length-1):(L+(W-L-R)/2);
  const y=p=>T+(H-T-B)*(1-p);
  const CHN={}; Object.entries(QCH).forEach(([k,v])=>CHN[v]=k.replace('篇章',''));
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  [0,.5,.7,1].forEach(g=>{ s+=`<line x1="${L}" y1="${y(g)}" x2="${W-R}" y2="${y(g)}" stroke="${g===0.7?'rgba(0,168,138,.4)':'#F1F5F9'}" stroke-width="1" ${g===0.7?'stroke-dasharray="4 4"':''}/>`+
    `<text x="${L-6}" y="${y(g)+3.5}" font-size="9.5" fill="#94A3B8" text-anchor="end">${Math.round(g*100)}%</text>`; });
  if(pts.length>1) s+=`<polyline fill="none" stroke="url(#gr)" stroke-width="2" points="${pts.map((p,i)=>x(i)+','+y(p.pct)).join(' ')}"/>`;
  s+=`<defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0891B2"/><stop offset="1" stop-color="#00A88A"/></linearGradient></defs>`;
  pts.forEach((p,i)=>{ const d=(p.ts||'').slice(5,10).replace('-','/');
    s+=`<circle cx="${x(i)}" cy="${y(p.pct)}" r="4" fill="${p.pct>=0.7?'#00A88A':'#94A3B8'}"><title>${CHN[p.chapter]||p.chapter} · ${p.correct}/${p.n} · ${d}</title></circle>`;
    if(pts.length<=14) s+=`<text x="${x(i)}" y="${H-10}" font-size="9" fill="#94A3B8" text-anchor="middle">${d}</text>`; });
  box.innerHTML=s+'</svg>';
}

/* 成长地图是登录后的专属空间：没登录直接去登录，不做匿名版 */
(async function(){
  const t=localStorage.getItem(TK);
  if(!t){ location.replace('index.html#login'); return; }
  try{ const c=JSON.parse(localStorage.getItem('hab_user')||'null');
    if(c){ const b=$('#loginBtn'); b.className='uava'; b.title=c.nickname||'';
      b.innerHTML=c.avatar?'<img src="'+c.avatar+'" alt="">':'<span class="ph">'+(c.nickname||'我')[0]+'</span>';
      b.removeAttribute('href'); } }catch(e){}
  try{
    const r=await fetch(API+'/api/me',{headers:{Authorization:'Bearer '+t}});
    if(!r.ok){ localStorage.removeItem(TK); localStorage.removeItem('hab_user'); location.replace('index.html#login'); return; }
    const u=await r.json(); logged=true;
    localStorage.setItem('hab_user',JSON.stringify({nickname:u.nickname,avatar:u.avatar}));
    const b=$('#loginBtn'); b.className='uava'; b.title=u.nickname||'';
    b.innerHTML=u.avatar?'<img src="'+u.avatar+'" alt="">':'<span class="ph">'+(u.nickname||'我')[0]+'</span>';
    b.removeAttribute('href');
    $('#logoutBtn').style.display='inline-block';
    $('#logoutBtn').onclick=()=>{ if(confirm('退出登录？')){ localStorage.removeItem(TK); localStorage.removeItem('hab_user'); location.href='index.html'; } };
    const pr=await fetch(API+'/api/progress',{headers:{Authorization:'Bearer '+t}});
    if(pr.ok){ const pg=await pr.json();
      (pg.done||[]).forEach(f=>done.add(f));
      localStorage.setItem('hab_done',JSON.stringify([...done]));
      Object.entries(pg.best||{}).forEach(([c,p])=>{ if(p>(best[c]||0)) best[c]=p; });
      localStorage.setItem('hab_quiz_best',JSON.stringify(best));
      if((pg.quiz||[]).length) attempts=pg.quiz;
      taskSt=pg.task||{}; }
  }catch(e){}   // 网络抖动:仍按已登录渲染本地数据,不把人踢出去
  renderAll();
})();
function renderAll(){ renderChapters(); renderTasks(); renderCurve(); }
</script>
<script src="track.js"></script>
<script src="sparky.js" defer></script>
</body>
</html>

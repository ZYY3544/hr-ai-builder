<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
<link rel="icon" href="favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<link rel="alternate icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>课程阅读器 · meansights learning</title>
<meta name="robots" content="noindex">
<style>
:root{
  --blue:#3370FF; --blue-d:#1F55E0; --blue-s:#EEF3FF;
  --pri:#00A88A; --pri-d:#00876F; --pri-s:#E8FBF6;
  --violet:#7C3AED; --violet-s:#F5EFFF;
  --green:#00C6A2; --green-d:#00A88A; --green-s:#E8FBF6;
  --grad-r:linear-gradient(135deg,#00A88A,#0891B2);
  --ink:#0F172A; --body:#475569; --muted:#64748B; --faint:#94A3B8;
  --line:#E2E8F0; --line-soft:#F1F5F9; --bg:#F8FAFC;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font:13px/1.7 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC',sans-serif;
  color:var(--body);background:#fff;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden}
a{color:inherit;text-decoration:none}

/* ── 顶栏 ── */
.top{flex:0 0 auto;border-bottom:1px solid var(--line);background:#fff;z-index:20}
.mark{height:25px;width:auto;display:block}
.t-l{background:#FEF3C7;color:#92400E}
.prog{display:flex;align-items:center;gap:9px;padding:12px 16px 0}
.pbar{flex:1;min-width:56px;max-width:120px;height:5px;background:var(--line-soft);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--grad-r);border-radius:3px;transition:width .3s}
.prog .n{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbtn{font:inherit;font-size:12.5px;padding:6px 13px;border-radius:6px;border:1px solid var(--line);
  background:#fff;color:var(--body);cursor:pointer;white-space:nowrap}
.tbtn:hover{border-color:var(--pri);color:var(--pri)}
.tbtn.pri{background:var(--grad-r);border-color:transparent;color:#fff}
@media(max-width:900px){.prog .n{display:none}}

/* ── 主体 ── */
.main{flex:1;display:flex;min-height:0}
.side{width:288px;flex:0 0 auto;border-right:1px solid var(--line);background:var(--bg);
  display:flex;flex-direction:column;min-height:0}
.side .sch{padding:12px 14px 10px;flex:0 0 auto}
.side input{width:100%;font:inherit;font-size:12.5px;padding:8px 12px;border:1px solid var(--line);
  -webkit-appearance:none;appearance:none;
  border-radius:8px;background:#fff;color:var(--ink)}
.side input:focus{outline:none;border-color:var(--pri)}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.ls .mn{font-size:10px;color:var(--faint);margin-left:6px;font-variant-numeric:tabular-nums;opacity:.85;white-space:nowrap}
.tree{flex:1;overflow-y:auto;padding:0 8px 30px}
.pt{margin:14px 0 4px;padding:0 6px}
.pt .num{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--pri);text-transform:uppercase}
.pt .ti{font-size:13px;font-weight:600;color:var(--ink);margin-top:1px;line-height:1.4}
.tp{margin:2px 0}
.tp-h{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:7px;cursor:pointer;
  font-size:12.5px;font-weight:500;color:var(--ink)}
.tp-h:hover{background:#fff}
.tp-h .ar{color:var(--faint);font-size:10px;transition:.15s;flex:0 0 auto}
.tp.open .tp-h .ar{transform:rotate(90deg)}
.tp-h .nm{flex:1;line-height:1.45}
.tp-h .ct{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;flex:0 0 auto}
.tp-l{display:none;padding:1px 0 4px 15px}
.tp.open .tp-l{display:block}
.ls{display:flex;align-items:flex-start;gap:7px;padding:6px 9px;border-radius:7px;cursor:pointer;
  position:relative;
  font-size:12.5px;color:var(--body);line-height:1.55}
.ls:hover{background:#fff}
.ls.on{background:var(--pri-s);color:var(--pri);font-weight:500}
.ls.off{color:var(--faint);cursor:default}
.ls.off:hover{background:none}
.dot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line);flex:0 0 auto;margin-top:3px}
.ls.on .dot{border-color:var(--pri)}
.ls.done .dot{background:var(--green);border-color:var(--green)}
.ls .lk{font-size:9px;opacity:.55;margin-left:3px}
.side .foot{flex:0 0 auto;padding:11px 16px;border-top:1px solid var(--line);font-size:11px;
  color:var(--faint);line-height:1.75}
.side .foot a{color:var(--muted);border-bottom:1px solid var(--line)}

/* ── 内容区 ── */
.pane{flex:1;position:relative;min-width:0;display:flex;flex-direction:column}
.pane iframe{flex:1;width:100%;border:0;background:#fff}
.donetag{margin-left:auto;font-size:11.5px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
.donetag:hover{color:var(--green-d)}
.donetag.done{color:var(--green-d);font-weight:500}
/* 本章小测：目录里的独立卡片 + 阅读区的测验视图 */
.quizls{display:flex;align-items:center;gap:8px;margin:10px 8px 16px;padding:10px 13px;
  border:1.5px solid rgba(0,168,138,.35);border-radius:11px;text-decoration:none;
  background:linear-gradient(135deg,rgba(0,168,138,.05),rgba(8,145,178,.05));
  font-size:12.5px;font-weight:600;color:#00795F;cursor:pointer}
.quizls:hover{border-color:#00A88A}
.quizls.on{background:linear-gradient(135deg,rgba(0,168,138,.13),rgba(8,145,178,.13))}
.quizls .sc{margin-left:auto;font-weight:500;font-size:11.5px;color:var(--muted)}
.quizls .sc.pass{color:#00795F;font-weight:600}
#quizpane{flex:1;overflow-y:auto;display:none;background:#fff}
#quizpane .hq-in{max-width:820px;margin:36px auto 80px;padding:0 28px;color:#0F172A}
#quizpane .hq-h{font-size:13px;font-weight:600;color:#00795F;letter-spacing:.06em;margin:0 0 4px}
#quizpane .hq-sub{font-size:12.5px;color:#64748B;margin:0 0 18px}
#quizpane .hq-q{font-size:14.5px;font-weight:600;line-height:1.7;margin:22px 0 10px}
#quizpane .hq-o{display:block;width:100%;text-align:left;font:inherit;font-size:13.5px;line-height:1.65;
  padding:9px 13px;margin:7px 0;border:1.5px solid #E2E8F0;border-radius:10px;background:#fff;
  color:#334155;cursor:pointer;transition:border-color .12s}
#quizpane .hq-o:hover{border-color:#00A88A}
#quizpane .hq-o.sel{border-color:#00A88A;background:#F0FDFA}
#quizpane .hq-o.ok{border-color:#00A88A;background:#E8FBF6;color:#00795F;font-weight:600}
#quizpane .hq-o.bad{border-color:#FCA5A5;background:#FEF2F2;color:#B91C1C}
#quizpane .hq-o:disabled{cursor:default}
#quizpane .hq-exp{font-size:12.5px;line-height:1.8;color:#475569;background:#F8FAFC;
  border-left:3px solid #00A88A;border-radius:0 8px 8px 0;padding:10px 14px;margin:10px 0 4px}
#quizpane .hq-go{font:inherit;font-size:12.5px;font-weight:600;padding:7px 16px;margin-top:10px;
  border:none;border-radius:8px;background:linear-gradient(135deg,#00A88A,#0891B2);color:#fff;cursor:pointer}
#quizpane .hq-go:disabled{opacity:.45;cursor:default}
#quizpane .hq-sum{margin:26px 0 0;padding:16px 18px;border:1.5px solid #E2E8F0;border-radius:12px;
  font-size:13.5px;line-height:1.8;color:#334155;background:#F8FAFC}
#quizpane .hq-sum.pass{border-color:rgba(0,168,138,.45);background:#E8FBF6;color:#00795F}

.sbtn{display:none;font:inherit;font-size:16px;background:none;border:0;cursor:pointer;color:var(--muted);padding:4px 8px}
@media(max-width:860px){
  .sbtn{display:block}
  .side{position:fixed;top:60px;left:0;bottom:0;z-index:30;transform:translateX(-100%);transition:.22s;box-shadow:0 0 40px rgba(15,23,42,.2)}
  .side.show{transform:none}
}

/* ── 侧栏可拖拽调宽 ── */
#dragbar{width:5px;flex:0 0 auto;cursor:col-resize;background:transparent;position:relative}
#dragbar:hover::after,#dragbar.on::after{content:'';position:absolute;inset:0 2px;background:var(--pri);opacity:.5}
body.dragging{user-select:none;cursor:col-resize}
body.dragging iframe{pointer-events:none}
/* ── toast ── */
#toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(10px);z-index:60;
  background:var(--ink);color:#fff;font-size:12.5px;padding:9px 18px;border-radius:20px;
  opacity:0;pointer-events:none;transition:.22s}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* 全站统一导航（与首页一致，便于任意页之间跳转） */
/* ── 全站统一顶栏（数值照抄首页，改这里前先对 index.html） ── */
.gwrap{max-width:1400px;margin:0 auto;padding:0 40px;display:flex;align-items:center;gap:24px;height:60px}
.brand{display:flex;align-items:center;flex:0 0 auto;margin-left:-42px;transition:opacity .15s}
.brand:hover{opacity:.72}
.glinks{display:flex;align-items:center;justify-content:flex-end;gap:20px;flex:1;position:relative;top:5.87px}
.glinks a{font-size:14px;font-weight:600;color:var(--muted);padding:6px 12px;border-radius:6px;line-height:1.2;transition:.15s}
.glinks a:hover{color:var(--pri);background:rgba(0,168,138,.07)}
.glinks a.cur{color:var(--pri)}
.gright{display:flex;align-items:center;gap:9px;flex:0 0 auto;position:relative;top:5.87px}
.gbtn{font-size:12.5px;font-weight:500;padding:6.5px 14px;border-radius:6px;color:#fff;white-space:nowrap;
  background:linear-gradient(135deg,#00A88A,#0891B2);box-shadow:0 3px 12px -3px rgba(0,168,138,.6)}
@media(max-width:1402px){.brand{margin-left:0}}
@media(max-width:960px){.glinks{display:none}}
</style>
</head>
<body>

<div class="top"><div class="gwrap">
    <button class="sbtn" id="sbtn">☰</button>
    <a class="brand" href="index.html"><picture><source media="(max-width:1100px)" srcset="brand/lockup.svg"><img class="mark" src="brand/lockup-product.svg" alt="meansights — HR AI Learning Agent"></picture></a>
    <div class="glinks">
      <a href="learn.html" class="cur">课程内容</a>
      <a href="tasks.html">实战任务</a>
      <a href="jobs.html">岗位机会</a>
      <a href="about.html">关于我们</a>
    </div>
    <div class="gright"><a class="gbtn" href="index.html#login" id="loginBtn">登录</a></div>
</div></div>

<div class="main">
  <aside class="side" id="side">
    <div class="prog"><div class="pbar"><i id="pbar" style="width:0"></i></div><span class="n" id="pnum">0 / 0</span><span class="donetag" id="mark"></span></div>
    <div class="sch"><input id="q" type="search" name="lesson-search" placeholder="搜索知识点…" autocomplete="off" autocorrect="off" spellcheck="false" data-1p-ignore data-lpignore="true" data-bwignore data-form-type="other"></div>
    <div class="tree" id="tree"></div>
    <div class="foot">
      内容永久免费开放<br><a href="https://github.com/ZYY3544/hr-ai-builder" target="_blank" rel="noopener">GitHub</a> · AGPL-3.0 开源
    </div>
  </aside>

  <div id="dragbar"></div>

  <div class="pane">
    <iframe id="frame" title="课程内容"></iframe>
    <div id="quizpane"></div>
  </div>
</div>

<div id="toast"></div>

<script src="course-data.js"></script>
<script>
const $=s=>document.querySelector(s);
const CO=window.COURSE||{parts:[]};
const DONE_KEY='hab_done', TK='hab_token';

/* 扁平序列 —— 上一节/下一节靠它 */
const FLAT=[];
CO.parts.forEach(p=>p.topics.forEach(t=>t.lessons.forEach(l=>{
  if(l.ready) FLAT.push({...l, part:p.num, partTitle:p.title, topic:t.title});
})));

const done=new Set(JSON.parse(localStorage.getItem(DONE_KEY)||'[]'));
const saveDone=()=>localStorage.setItem(DONE_KEY,JSON.stringify([...done]));
const cur=()=>decodeURIComponent((location.hash||'').replace(/^#/,'')).trim();
const find=f=>FLAT.findIndex(x=>x.file===f);

function srcOf(l){
  // 全部课件都是静态页 —— 受限内容由页内 paywall.js 客户端遮挡（Flexible Sampling）
  return 'slides/'+l.file+'?embed=1';
}

function renderTree(filter){
  const kw=(filter||'').trim().toLowerCase();
  const f=cur();
  let html='';
  CO.parts.forEach(p=>{
    let ptHtml='';
    p.topics.forEach(t=>{
      const ls=t.lessons.filter(l=>!kw || l.title.toLowerCase().includes(kw) || t.title.toLowerCase().includes(kw));
      if(!ls.length) return;
      const rdy=t.lessons.filter(l=>l.ready);
      const dn=rdy.filter(l=>done.has(l.file)).length;
      const open = kw || t.lessons.some(l=>l.file===f);
      ptHtml+=`<div class="tp ${open?'open':''}">
        <div class="tp-h"><span class="ar">▸</span><span class="nm">${t.title}</span><span class="ct">${dn}/${rdy.length}</span></div>
        <div class="tp-l">${ls.map(l=>{
          if(!l.ready) return `<div class="ls off"><span class="dot"></span><span>${l.title} · 待写</span></div>`;
          return `<a class="ls ${l.file===f?'on':''} ${done.has(l.file)?'done':''}" href="#${encodeURIComponent(l.file)}">
            <span class="dot"></span><span>${l.title}<span class="mn">${l.min}′</span></span></a>`;
        }).join('')}</div></div>`;
    });
    // 每章一张独立的「本章小测」卡片，挂在这一章目录的末尾；搜索时不掺和
    const ch=(typeof QCH!=='undefined')&&QCH[p.num];
    if(ptHtml&&ch&&!kw){
      const best=QBEST[ch]||0;
      const sc=best>=0.7?'<span class="sc pass">已通关 ✓</span>':(best>0?`<span class="sc">最好 ${Math.round(best*100)}%</span>`:'');
      ptHtml+=`<a class="quizls ${('quiz:'+ch)===f?'on':''}" href="#quiz:${ch}"><span>✦ 本章小测</span>${sc}</a>`;
    }
    if(ptHtml) html+=`<div class="pt"><div class="num">${p.num}</div><div class="ti">${p.title}</div></div>${ptHtml}`;
  });
  $('#tree').innerHTML=html||'<div style="padding:20px 8px;color:var(--faint);font-size:12.5px">没有匹配的知识点</div>';
  $('#tree').querySelectorAll('.tp-h').forEach(h=>h.onclick=()=>h.parentNode.classList.toggle('open'));
}

function renderProgress(){
  const dn=FLAT.filter(l=>done.has(l.file)).length;
  $('#pbar').style.width=(FLAT.length?dn/FLAT.length*100:0)+'%';
  $('#pnum').textContent=`${dn} / ${FLAT.length}`;
  const a=CO.meta&&CO.meta.access||{};
}

function load(){
  let f=cur();
  const OLD2NEW={"0-intro.html": "start-dunning-kruger.html", "0-how.html": "start-how-to-learn.html", "0-why.html": "start-why-principles.html", "1-2-fake-chat.html": "hallu-fake-chat.html", "1-2-hallucination.html": "hallu-first-scene.html", "1-2-mitigation-prompt.html": "hallu-fix-prompt.html", "1-2-mitigation-rag.html": "hallu-fix-rag.html", "1-2-mitigation-temp.html": "hallu-fix-temp.html", "1-2-mitigation-eval.html": "hallu-fix-eval.html", "5-1.html": "context-window.html", "5-2.html": "context-overflow.html", "6-1.html": "prompt-system.html", "6-2.html": "prompt-advanced.html", "7-1.html": "agent-what.html", "10-1.html": "agent-vs-workflow.html", "7-4a.html": "agent-react.html", "7-4b.html": "agent-stuck.html", "8-1.html": "token-cost.html", "9-27.html": "cc-permissions.html", "9-28.html": "cc-permissions.html", "9-29.html": "harness-audit.html", "10-8.html": "eval-why.html", "10-9.html": "eval-graders.html", "10-10.html": "eval-pitfalls.html", "vibe-1.html": "vibe-rules.html", "vibe-2.html": "vibe-workflow.html", "vibe-5.html": "vibe-debug.html", "vibe-6.html": "vibe-complete.html", "vibe-7.html": "vibe-docs.html", "vibe-8.html": "vibe-env.html", "vibe-9.html": "vibe-safety.html", "oss-8.html": "jargon-deploy.html", "oss-9.html": "jargon-deploy.html", "interview-1.html": "interview-p1.html", "interview-2.html": "interview-p2.html", "interview-7.html": "interview-p4.html", "hr-org-1.html": "hr-org-3.html", "hr-org-2.html": "hr-org-3.html"};
  if(OLD2NEW[f]){ location.replace('#'+encodeURIComponent(OLD2NEW[f])); return; }
  if(/^quiz:/.test(f)){ renderQuizView(f.slice(5)); return; }
  $('#quizpane').style.display='none'; $('#frame').style.display='block'; $('#mark').style.display='';
  let i=find(f);
  if(i<0){ i=0; f=FLAT[0].file; location.replace('#'+encodeURIComponent(f)); }
  const l=FLAT[i];
  $('#frame').src=srcOf(l);
  document.title=l.title+' · meansights learning';
  const p=FLAT[i-1], n=FLAT[i+1];
  // 底部翻页条已撤：翻页走侧栏目录 + 键盘 ←→（iframe 内外都监听）
  window.goPrev=()=>p&&(location.hash='#'+encodeURIComponent(p.file));
  window.goNext=()=>n&&(location.hash='#'+encodeURIComponent(n.file));

  const m=$('#mark'), isDone=done.has(l.file);
  m.className='donetag'+(isDone?' done':'');
  m.textContent=isDone?'✓ 已学完':'○ 标记学完';
  m.title=isDone?'点击取消这节的学完标记':'把当前这节标记为学完';
  m.onclick=()=>{ done.has(l.file)?done.delete(l.file):done.add(l.file);
    saveDone(); renderTree($('#q').value); renderProgress(); load();
    const t=localStorage.getItem(TK);
    if(t) fetch(QAPI+'/api/progress',{method:'POST',
      headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},
      body:JSON.stringify({kind:'done',key:l.file,value:{on:done.has(l.file)}})}).catch(()=>{}); };

  renderTree($('#q').value); renderProgress();
  const on=$('#tree .ls.on'); if(on) on.scrollIntoView({block:'nearest'});
  $('#side').classList.remove('show');
}

/* ── toast ── */
let _tt;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(_tt); _tt=setTimeout(()=>t.classList.remove('on'),2000);
}

/* ── 侧栏拖拽调宽 ── */
(function(){
  const K='hab_sidew', bar=$('#dragbar'), side=$('#side');
  try{ const w=+localStorage.getItem(K); if(w>=200&&w<=520) side.style.width=w+'px'; }catch(e){}
  let on=false;
  bar.addEventListener('mousedown',e=>{on=true;bar.classList.add('on');document.body.classList.add('dragging');e.preventDefault();});
  window.addEventListener('mousemove',e=>{
    if(!on) return;
    const w=Math.min(520,Math.max(200,e.clientX));
    side.style.width=w+'px';
  });
  window.addEventListener('mouseup',()=>{
    if(!on) return; on=false; bar.classList.remove('on'); document.body.classList.remove('dragging');
    try{ localStorage.setItem(K, parseInt(side.style.width)); }catch(e){}
  });
})();


$('#q').oninput=e=>renderTree(e.target.value);
$('#sbtn').onclick=()=>$('#side').classList.toggle('show');
window.addEventListener('hashchange',load);
/* 本章小测：每章一张独立卡片（目录里 ✦ 本章小测），点开在阅读区单独呈现。
   从本章题库随机抽 8 道；前端拿不到答案，点选后交服务端判分并回解析。
   全部答完给通关判定（≥70% 点亮），成绩落库（登录走服务端，匿名存本地）。 */
const QAPI=(location.hostname==='localhost'?'http://localhost:8001':'https://hr-ai-builder-api.onrender.com');
const QCH={'第零篇章':'p-zero','第一篇章':'p-1','第二篇章':'p-2','第三篇章':'p-3','第四篇章':'p-4',
           '第五篇章':'p-5','第六篇章':'p-6','第七篇章':'p-7','第八篇章':'p-8','第九篇章':'p-9'};
const QBEST_KEY='hab_quiz_best';
const QBEST=JSON.parse(localStorage.getItem(QBEST_KEY)||'{}');   // {章代码: 最好正确率}
function saveBest(ch,pct){
  if(pct>(QBEST[ch]||0)){ QBEST[ch]=pct; localStorage.setItem(QBEST_KEY,JSON.stringify(QBEST)); }
}
async function saveAttempt(ch,correct,n){
  saveBest(ch,n?correct/n:0);
  const t=localStorage.getItem(TK);
  if(t){
    try{ await fetch(QAPI+'/api/progress',{method:'POST',
      headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},
      body:JSON.stringify({kind:'quiz',key:ch,value:{correct,n}})}); }catch(e){}
  } else {
    try{ const h=JSON.parse(localStorage.getItem('hab_quiz_local')||'[]');
      h.push({ch,correct,n,ts:new Date().toISOString()});
      localStorage.setItem('hab_quiz_local',JSON.stringify(h.slice(-200))); }catch(e){}
  }
}

async function renderQuizView(ch){
  const part=Object.keys(QCH).find(k=>QCH[k]===ch);
  if(!part){ location.replace('#'+encodeURIComponent(FLAT[0].file)); return; }
  $('#frame').style.display='none';
  const pane=$('#quizpane'); pane.style.display='block';
  $('#mark').style.display='none';
  document.title='本章小测 · '+part+' · meansights learning';
  renderTree($('#q').value);
  // ←→ 依然有意义：上一步=本章最后一节，下一步=下一章第一节
  const inCh=FLAT.filter(l=>l.part===part);
  const lastIdx=find(inCh[inCh.length-1].file), next=FLAT[lastIdx+1];
  window.goPrev=()=>location.hash='#'+encodeURIComponent(inCh[inCh.length-1].file);
  window.goNext=()=>next&&(location.hash='#'+encodeURIComponent(next.file));

  pane.innerHTML='<div class="hq-in"><p class="hq-h">本章小测 · '+part+'</p><p class="hq-sub">出题中…</p></div>';
  let pool=[];
  try{ const r=await fetch(QAPI+'/api/quiz?chapter='+ch); if(r.ok) pool=(await r.json()).items||[]; }catch(e){}
  if(!pool.length){ pane.querySelector('.hq-sub').textContent='题目没取到——网络抖了下，切走再切回来重试。'; return; }
  const items=pool.sort(()=>Math.random()-.5).slice(0,8);
  const box=document.createElement('div'); box.className='hq-in';
  box.innerHTML='<p class="hq-h">本章小测 · '+part+'</p>'+
    '<p class="hq-sub">从本章题库随机抽 '+items.length+' 道——答错也没关系，解析比对错有用。答对 70% 点亮本章。</p>';
  let ansN=0, okN=0;
  const finish=()=>{
    const pct=okN/items.length, pass=pct>=0.7;
    const sum=document.createElement('div'); sum.className='hq-sum'+(pass?' pass':'');
    sum.innerHTML=(pass?'🎉 <b>本章通关！</b>':'<b>差一点。</b>')+' 答对 '+okN+' / '+items.length+
      (pass?'':'——回去翻翻错题对应的那几节，随时可以再抽一轮。');
    const again=document.createElement('button'); again.className='hq-go'; again.textContent='再抽一轮';
    again.onclick=()=>renderQuizView(ch);
    sum.appendChild(document.createElement('br')); sum.appendChild(again);
    box.appendChild(sum); sum.scrollIntoView({behavior:'smooth',block:'nearest'});
    saveAttempt(ch,okN,items.length);
    renderTree($('#q').value);          // 卡片上的通关标即时点亮
  };
  const grade=async (q,given,btns,wrap)=>{
    const res=await fetch(QAPI+'/api/quiz/submit',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({answers:{[q.id]:given}})});
    if(!res.ok) return;
    const d=(await res.json()).details[0];
    const ans=Array.isArray(d.ans)?d.ans:[d.ans];
    btns.forEach((b,i)=>{ b.disabled=true;
      if(ans.includes(i)) b.className='hq-o ok';
      else if(b.classList.contains('sel')||(!Array.isArray(given)&&i===given)) b.className='hq-o bad'; });
    const ex=document.createElement('div'); ex.className='hq-exp';
    ex.innerHTML=(d.correct?'✓ 对了。':'✗ 不对。')+(d.exp||'');   // exp 是自家题库的富文本(<b>等)
    wrap.appendChild(ex);
    if(window.habTrack) habTrack('quiz',{extra:{chapter:ch,qid:q.id,correct:d.correct}});
    ansN++; okN+=d.correct?1:0;
    if(ansN===items.length) finish();
  };
  items.forEach((q,qi)=>{
    const wrap=document.createElement('div');
    const h=document.createElement('p'); h.className='hq-q';
    h.innerHTML=(qi+1)+'. '+q.q+(q.type==='multi'?'（多选）':''); wrap.appendChild(h);
    const btns=q.opts.map(o=>{
      const b=document.createElement('button'); b.className='hq-o'; b.innerHTML=o;
      wrap.appendChild(b); return b; });
    if(q.type==='multi'){
      const go=document.createElement('button'); go.className='hq-go'; go.textContent='确认';
      btns.forEach(b=>b.onclick=()=>b.classList.toggle('sel'));
      go.onclick=()=>{ const sel=btns.map((b,i)=>b.classList.contains('sel')?i:-1).filter(i=>i>=0);
        if(!sel.length) return; go.disabled=true; grade(q,sel,btns,wrap); };
      wrap.appendChild(go);
    } else {
      btns.forEach((b,i)=>b.onclick=()=>grade(q,i,btns,wrap));
    }
    box.appendChild(wrap);
  });
  pane.innerHTML=''; pane.appendChild(box); pane.scrollTop=0;
}

/* iframe 内按 ←/→ 也能翻节：same-origin，把按键转发到父页 */
$('#frame').addEventListener('load',()=>{ try{
  $('#frame').contentDocument.addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
    if(e.key==='ArrowLeft') window.goPrev&&window.goPrev();
    if(e.key==='ArrowRight') window.goNext&&window.goNext();
  });
}catch(e){} });
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowLeft') window.goPrev&&window.goPrev();
  if(e.key==='ArrowRight') window.goNext&&window.goNext();
});

/* 登录态 + 服务端进度合并：学完的节、各章最好成绩都跟着账号走 */
(async function(){
  const t=localStorage.getItem(TK); if(!t) return;
  const b=$('#loginBtn');
  const show=u=>{ b.textContent=u.nickname||'我的成长'; b.className='gbtn'; b.href='growth.html'; b.title='我的成长'; };
  try{ const c=JSON.parse(localStorage.getItem('hab_user')||'null'); if(c) show(c); }catch(e){}  // 同步先画缓存,不闪"登录"
  try{
    const r=await fetch(QAPI+'/api/me',{headers:{Authorization:'Bearer '+t}});
    if(!r.ok){ if(r.status===401){ localStorage.removeItem(TK); localStorage.removeItem('hab_user');
      b.textContent='登录'; b.href='index.html#login'; } return; }
    const u=await r.json();
    localStorage.setItem('hab_user',JSON.stringify({nickname:u.nickname,avatar:u.avatar}));
    show(u);
    const pr=await fetch(QAPI+'/api/progress',{headers:{Authorization:'Bearer '+t}});
    if(pr.ok){ const pg=await pr.json();
      (pg.done||[]).forEach(f=>done.add(f)); saveDone();
      Object.entries(pg.best||{}).forEach(([ch,p])=>saveBest(ch,p));
      renderTree($('#q').value); renderProgress(); }
  }catch(e){}
})();

load();
</script>

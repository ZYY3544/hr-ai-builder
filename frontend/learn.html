<title>课程阅读器 · meansights learning</title>
<meta name="robots" content="noindex">
<style>
:root{
  --blue:#3370FF; --blue-d:#1F55E0; --blue-s:#EEF3FF;
  --pri:#00A88A; --pri-d:#00876F; --pri-s:#E8FBF6;
  --violet:#7C3AED; --violet-s:#F5EFFF;
  --green:#00C6A2; --green-d:#00A88A; --green-s:#E8FBF6;
  --grad-r:linear-gradient(135deg,#00A88A,#0891B2);
  --ink:#0F172A; --body:#475569; --muted:#64748B; --faint:#94A3B8;
  --line:#E2E8F0; --line-soft:#F1F5F9; --bg:#F8FAFC;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font:13px/1.7 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC',sans-serif;
  color:var(--body);background:#fff;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden}
a{color:inherit;text-decoration:none}

/* ── 顶栏 ── */
.top{flex:0 0 auto;border-bottom:1px solid var(--line);background:#fff;z-index:20}
.mark{height:25px;width:auto;display:block}
.t-l{background:#FEF3C7;color:#92400E}
.tbtn{font:inherit;font-size:12.5px;padding:6px 13px;border-radius:6px;border:1px solid var(--line);
  background:#fff;color:var(--body);cursor:pointer;white-space:nowrap}
.tbtn:hover{border-color:var(--pri);color:var(--pri)}
.tbtn.pri{background:var(--grad-r);border-color:transparent;color:#fff}

/* ── 主体 ── */
.main{flex:1;display:flex;min-height:0}
.side{width:288px;flex:0 0 auto;border-right:1px solid var(--line);background:var(--bg);
  display:flex;flex-direction:column;min-height:0}
.side .sch{padding:12px 14px 10px;flex:0 0 auto}
.side input{width:100%;font:inherit;font-size:12.5px;padding:8px 12px;border:1px solid var(--line);
  -webkit-appearance:none;appearance:none;
  border-radius:8px;background:#fff;color:var(--ink)}
.side input:focus{outline:none;border-color:var(--pri)}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.tree{flex:1;overflow-y:auto;padding:0 8px 30px}
/* 侧栏三级层次：篇章 > 主题 > 节。
   原来篇章标题 13px/600、主题 12.5px/500，只差半个像素和一档字重，还都是同一个墨色——
   肉眼根本分不出谁包着谁。层次要靠**多个信号叠加**：字号 + 字重 + 颜色深浅，
   再用一条分隔线把篇章之间切开做视觉分块。 */
.pt{margin:26px 0 6px;padding:15px 6px 0;border-top:1px solid var(--line)}
.pt:first-of-type{margin-top:6px;padding-top:2px;border-top:0}
.pt .num{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--pri)}
.pt .ti{font-size:14.5px;font-weight:650;color:var(--ink);margin-top:4px;
  line-height:1.35;letter-spacing:-.012em}
.tp{margin:2px 0}
/* 主题：比篇章浅一档（--body 而非 --ink），展开或命中当前节时才升到墨色 */
.tp-h{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:7px;cursor:pointer;
  font-size:12.5px;font-weight:500;color:var(--body);transition:color .12s}
.tp-h:hover{background:#fff;color:var(--ink)}
.tp.open>.tp-h{color:var(--ink);font-weight:600}
.tp-h .ar{color:var(--faint);font-size:10px;transition:.15s;flex:0 0 auto}
.tp.open .tp-h .ar{transform:rotate(90deg)}
.tp-h .nm{flex:1;line-height:1.45}
.tp-h .ct{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;flex:0 0 auto}
.tp-l{display:none;padding:1px 0 4px 15px}
.tp.open .tp-l{display:block}
/* 节：最浅的一档（--muted），当前节才用主色 */
.ls{display:flex;align-items:flex-start;gap:7px;padding:6px 9px;border-radius:7px;cursor:pointer;
  position:relative;
  font-size:12.5px;color:var(--muted);line-height:1.55}
.ls:hover{background:#fff;color:var(--body)}
.ls.on{background:var(--pri-s);color:var(--pri);font-weight:500}
.ls.off{color:var(--faint);cursor:default}
.ls.off:hover{background:none}
.dot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line);flex:0 0 auto;margin-top:3px}
.ls.on .dot{border-color:var(--pri)}
.ls.done .dot{background:var(--green);border-color:var(--green)}
.ls.done{color:var(--body)}          /* 读过的略深一点，跟没读的拉开 */
.ls.on{font-weight:500}
.ls .lk{font-size:9px;opacity:.55;margin-left:3px}
.side .foot{flex:0 0 auto;padding:11px 16px;border-top:1px solid var(--line);font-size:11px;
  color:var(--faint);line-height:1.75}
.side .foot a{color:var(--muted);border-bottom:1px solid var(--line)}

/* ── 内容区 ── */
.pane{flex:1;position:relative;min-width:0;display:flex;flex-direction:column}
.pane iframe{flex:1;width:100%;border:0;background:#fff}
/* 本章小测：目录里的独立卡片 + 阅读区的测验视图 */
.quizls{display:flex;align-items:center;gap:8px;margin:10px 8px 16px;padding:10px 13px;
  border:1.5px solid rgba(0,168,138,.35);border-radius:11px;text-decoration:none;
  background:linear-gradient(135deg,rgba(0,168,138,.05),rgba(8,145,178,.05));
  font-size:12.5px;font-weight:600;color:#00795F;cursor:pointer}
.quizls:hover{border-color:#00A88A}
.quizls.on{background:linear-gradient(135deg,rgba(0,168,138,.13),rgba(8,145,178,.13))}
.quizls .sc{margin-left:auto;font-weight:500;font-size:11.5px;color:var(--muted)}
.quizls .sc.pass{color:#00795F;font-weight:600}
/* ── 对话式测评(hqc 系)：终端化纯文字流，同 meansights 主产品 .sparky-messages ——
   整个画布就是对话：无气泡无卡片，Sparky 的话直接落在页面上；
   用户输入左对齐，贴文字一条品牌色底纹；猫头像顶对齐第一行文字。 ── */
#quizpane{background:#fff}
#quizpane .hqc{max-width:980px;margin:0;padding:22px 30px 34px 44px;min-height:100%;display:flex;flex-direction:column}
#quizpane .hqc-log{flex:1}
#quizpane .hqm{display:flex;gap:8px;margin:13px 0;align-items:flex-start}
#quizpane .hqm.me{margin:24px 0 10px}   /* 用户消息=新一轮开头，轮前多留空 */
#quizpane .hq-dot{flex-shrink:0;width:14px;margin-top:7px;color:#00A88A;font-size:10px;line-height:1}
/* ●与›同占14px列宽 → 用户消息首字和 Sparky 首字对齐 */
#quizpane .hqb{flex:1;min-width:0;max-width:100%;padding:0;background:transparent;border:none;box-shadow:none;
  font-size:13.5px;line-height:1.85;color:#0F172A}
#quizpane .hqm.me .hqb{display:flex;gap:8px;align-items:flex-start;font-weight:500}
#quizpane .hq-umark{flex-shrink:0;width:14px;color:#00A88A;font-weight:800;font-size:15px;line-height:1.5;margin-top:0}
#quizpane .hq-ubody{flex:0 1 auto;min-width:0;background:#DCF3ED;border-radius:8px;line-height:1.7;
  padding:2px 8px 3px;margin:-2px -8px -3px}   /* 底纹贴文字：padding 撑色、负 margin 收位，文字坐标不动 */
#quizpane .hqb.live::after{content:'▍';color:#00A88A;margin-left:1px;animation:hqcblink 1s steps(1) infinite}
@keyframes hqcblink{50%{opacity:0}}
#quizpane .hqc-q{font-size:14.5px;font-weight:650;color:#0F172A;margin-top:6px;line-height:1.75}
#quizpane .hqc-x{color:#DC2626;font-weight:700}
#quizpane .hqc-hint{font-size:12px;color:#94A3B8;margin:2px 0 4px 22px}
#quizpane .hqc-opts{display:flex;flex-direction:column;gap:7px;margin:2px 0 6px 18px;max-width:calc(100% - 18px)}
#quizpane .hqc-opt{text-align:left;font:inherit;font-size:13.5px;padding:10px 15px;border:1.5px solid rgba(0,168,138,.35);
  border-radius:11px;background:#fff;cursor:pointer;line-height:1.7;color:#0F172A;font-weight:500;transition:.13s;
  box-shadow:0 1px 2px rgba(15,23,42,.04)}
#quizpane .hqc-opt:hover{border-color:#00A88A;background:#F0FDF9;transform:translateX(2px)}
#quizpane .hqc-opt.sel{border-color:#00A88A;background:#E8FBF6}
#quizpane .hqc-opts.answered .hqc-opt{pointer-events:none;opacity:.45}
#quizpane .hqc-opts.answered .hqc-opt.ok{opacity:1;border-color:#00A88A;background:#E8FBF6;font-weight:600}
#quizpane .hqc-opts.answered .hqc-opt.bad{opacity:1;border-color:#DC2626;background:#FEF2F2}
#quizpane .hqc-goml{align-self:flex-start;font:inherit;font-size:12.5px;font-weight:600;padding:7px 18px;border:none;
  border-radius:8px;background:linear-gradient(135deg,#00A88A,#0891B2);color:#fff;cursor:pointer}
#quizpane .hqc-acts{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0 6px 18px}
#quizpane .hqc-act{font:inherit;font-size:12.5px;font-weight:600;padding:8px 16px;border-radius:9px;
  border:1.5px solid rgba(0,168,138,.45);background:#fff;color:#00795F;cursor:pointer}
#quizpane .hqc-act.pri{background:linear-gradient(135deg,#00A88A,#0891B2);border-color:transparent;color:#fff}
#quizpane .hqc-act.ghost{border-color:#E2E8F0;color:#64748B}
#quizpane .hqc-inp{display:none;position:sticky;bottom:0;background:#fff;padding:8px 0 16px}
#quizpane .hqc-shell{background:#fff;border:1px solid #E5E7EB;border-radius:16px;width:100%;
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);transition:border-color .15s}
#quizpane .hqc-shell:focus-within{border-color:#9CA3AF}
#quizpane .hqc-inp textarea{width:100%;font:inherit;font-size:13px;border:none;background:transparent;
  padding:13px 18px 4px;resize:none;outline:none;line-height:1.6;min-height:42px;box-sizing:border-box}
#quizpane .hqc-inp textarea::placeholder{color:#9CA3AF}
#quizpane .hqc-btm{display:flex;align-items:center;padding:2px 8px 8px 12px}
#quizpane .hqc-send{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:none;
  border-radius:12px;background:#00A88A;color:#fff;cursor:pointer;transition:.15s}
#quizpane .hqc-send:hover{background:#00876F}
#quizpane .hqc-send:disabled{opacity:.4;cursor:default}
#quizpane .hqc-end{font:inherit;font-size:12px;padding:4px 8px;border:none;background:none;color:#94A3B8;cursor:pointer}
#quizpane .hqc-end:hover{color:#00795F}
/* 思考态：Musing… 扫光(品牌绿高光扫过灰字，同主产品 thinking-shimmer)+ 行首点呼吸 */
@keyframes hqshimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes hqbreathe{0%,100%{opacity:.45}50%{opacity:1}}
#quizpane .hqc-typing{font-size:12.5px;
  background:linear-gradient(100deg,#94A3B8 35%,#00A88A 50%,#94A3B8 65%);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  animation:hqshimmer 1.9s linear infinite}
#quizpane .hqm.bot:has(.hqc-typing) .hq-dot{animation:hqbreathe 1.6s ease-in-out infinite}
#quizpane .hqc-refs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 6px 18px}
#quizpane .hqc-refs a{font-size:12px;font-weight:500;color:#00795F;border:1px solid rgba(0,168,138,.4);
  border-radius:8px;padding:5px 11px;background:#F0FDF9}
/* 右上角工具：+ 新开一场 / 时钟看历史(同 Sparky 浮窗的交互语言) */
#quizpane .hqc-tools{position:sticky;top:8px;z-index:6;height:0;display:flex;justify-content:flex-end;gap:6px}
#quizpane .hqc-ib{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:none;
  border-radius:9px;background:rgba(255,255,255,.92);color:#94A3B8;cursor:pointer;transition:.13s;
  box-shadow:0 1px 3px rgba(15,23,42,.08)}
#quizpane .hqc-ib:hover{color:#00795F;background:#F0FDF9}
#quizpane .hqc-ib svg{width:16px;height:16px}
/* 历史浮层：盖在对话区上面，活会话的 DOM 原封不动躺在下面 */
#quizpane .hqc-histp{position:fixed;display:none;z-index:40;background:#fff;overflow-y:auto;padding:18px 30px 30px 44px}
#quizpane .hqc-histp.on{display:block}
#quizpane .hqc-hhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
#quizpane .hqc-hhead b{font-size:13.5px;color:#0F172A}
#quizpane .hqc-hback{font:inherit;font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:8px;
  border:1.5px solid rgba(0,168,138,.45);background:#fff;color:#00795F;cursor:pointer}
#quizpane .hqc-hrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-size:13px;
  padding:11px 14px;border:1.5px solid #E5E7EB;border-radius:11px;background:#fff;cursor:pointer;margin-bottom:8px}
#quizpane .hqc-hrow:hover{border-color:#00A88A;background:#F0FDF9}
#quizpane .hqc-hrow .hd{color:#94A3B8;font-size:12px;flex-shrink:0}
#quizpane .hqc-hrow .hs{color:#0F172A;font-weight:600;flex:1}
#quizpane .hqc-hrow .hp{color:#00795F;font-size:12px;font-weight:700}
#quizpane .hqc-hempty{color:#94A3B8;font-size:13px;padding:20px 0}
#quizpane .hqc-hview .hqc-inp{display:none!important}
#quizpane{flex:1;overflow-y:auto;display:none;background:#fff}
#quizpane .hq-in{max-width:820px;margin:36px auto 80px;padding:0 28px;color:#0F172A}
#quizpane .hq-h{font-size:13px;font-weight:600;color:#00795F;letter-spacing:.06em;margin:0 0 4px}
#quizpane .hq-sub{font-size:12.5px;color:#64748B;margin:0 0 18px}
#quizpane .hq-q{font-size:14.5px;font-weight:600;line-height:1.7;margin:22px 0 10px}
#quizpane .hq-o{display:block;width:100%;text-align:left;font:inherit;font-size:13.5px;line-height:1.65;
  padding:9px 13px;margin:7px 0;border:1.5px solid #E2E8F0;border-radius:10px;background:#fff;
  color:#334155;cursor:pointer;transition:border-color .12s}
#quizpane .hq-o:hover{border-color:#00A88A}
#quizpane .hq-o.sel{border-color:#00A88A;background:#F0FDFA}
#quizpane .hq-o.ok{border-color:#00A88A;background:#E8FBF6;color:#00795F;font-weight:600}
#quizpane .hq-o.bad{border-color:#FCA5A5;background:#FEF2F2;color:#B91C1C}
#quizpane .hq-o:disabled{cursor:default}
#quizpane .hq-exp{font-size:12.5px;line-height:1.8;color:#475569;background:#F8FAFC;
  border-left:3px solid #00A88A;border-radius:0 8px 8px 0;padding:10px 14px;margin:10px 0 4px}
#quizpane .hq-go{font:inherit;font-size:12.5px;font-weight:600;padding:7px 16px;margin-top:10px;
  border:none;border-radius:8px;background:linear-gradient(135deg,#00A88A,#0891B2);color:#fff;cursor:pointer}
#quizpane .hq-go:disabled{opacity:.45;cursor:default}
#quizpane .hq-sum{margin:30px 0 0;padding:20px 22px;border:1.5px solid #E2E8F0;border-radius:14px;
  font-size:13.5px;line-height:1.8;color:#334155;background:#F8FAFC}
#quizpane .hq-sum.pass{border-color:rgba(0,168,138,.45);background:#E8FBF6}
#quizpane .hq-score{font-size:17px;font-weight:600;color:#0F172A;letter-spacing:-.01em}
#quizpane .hq-score span{font-size:13px;font-weight:500;color:#64748B;margin-left:8px}
#quizpane .hq-line{font-size:12.5px;color:#64748B;margin-top:6px}
/* 错题按 K/S/A 分档——差距是「能补的」还是「补不了的」，比分数本身有用 */
#quizpane .hq-wt{font-size:11px;font-weight:700;letter-spacing:.1em;color:#00795F;margin:18px 0 8px}
#quizpane .hq-kg{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:12.5px;
  border-top:1px solid rgba(15,23,42,.06)}
#quizpane .hq-kb{font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;color:#fff;flex:0 0 auto}
#quizpane .k-K{background:#3370FF} #quizpane .k-S{background:#00A88A} #quizpane .k-A{background:#7C3AED}
#quizpane .hq-kn{color:#0F172A;font-weight:600;flex:0 0 auto}
#quizpane .hq-kf{color:#64748B;font-size:12px}
#quizpane .hq-wl{list-style:none;margin:12px 0 0;padding:0}
#quizpane .hq-wl li{font-size:12.5px;line-height:1.75;color:#475569;padding:6px 0 6px 16px;
  position:relative;border-top:1px solid rgba(15,23,42,.05)}
#quizpane .hq-wl li:before{content:'✗';position:absolute;left:0;top:6px;color:#DC2626;font-size:11px}
#quizpane .hq-wl b{font-weight:500;color:#334155}
#quizpane .hq-tag{margin-left:8px;font-size:10.5px;color:#94A3B8;background:#fff;
  border:1px solid #E2E8F0;border-radius:4px;padding:1px 6px}
#quizpane .hq-acts{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}
#quizpane .hq-acts .hq-go{margin-top:0}
#quizpane .hq-go.ghost{background:#fff;color:#00795F;border:1px solid rgba(0,168,138,.4)}
#quizpane .hq-go.ghost:hover{background:#E8FBF6}

.sbtn{display:none;font:inherit;font-size:16px;background:none;border:0;cursor:pointer;color:var(--muted);padding:4px 8px}
@media(max-width:860px){
  .sbtn{display:block}
  .side{position:fixed;top:60px;left:0;bottom:0;z-index:30;transform:translateX(-100%);transition:.22s;box-shadow:0 0 40px rgba(15,23,42,.2)}
  .side.show{transform:none}
}

/* ── 侧栏可拖拽调宽 ── */
#dragbar{width:5px;flex:0 0 auto;cursor:col-resize;background:transparent;position:relative}
#dragbar:hover::after,#dragbar.on::after{content:'';position:absolute;inset:0 2px;background:var(--pri);opacity:.5}
body.dragging{user-select:none;cursor:col-resize}
body.dragging iframe{pointer-events:none}
/* ── toast ── */
#toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(10px);z-index:60;
  background:var(--ink);color:#fff;font-size:12.5px;padding:9px 18px;border-radius:20px;
  opacity:0;pointer-events:none;transition:.22s}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* 全站统一导航（与首页一致，便于任意页之间跳转） */
/* ── 全站统一顶栏（数值照抄首页，改这里前先对 index.html） ── */

<script>
const $=s=>document.querySelector(s);
const CO=window.COURSE||{parts:[]};
const DONE_KEY='hab_done', TK='hab_token';

/* 登录闸（按章）：前两章（第零/第一篇章）不登录可读——先尝后登；
   其余章 + 本章小测的后续章，登录解锁。课件静态页 slides/ 直访不拦（SEO 口）。 */
const FREE_PARTS=['第零篇章','第一篇章'];
const FREE_CH=['p-zero','p-1'];
const loggedIn=()=>!!localStorage.getItem(TK);
function gateTo(dest){
  try{ sessionStorage.setItem('hab_next','learn.html#'+dest); }catch(e){}
  location.replace('index.html#login');
}

/* 扁平序列 —— 上一节/下一节靠它 */
const FLAT=[];
CO.parts.forEach(p=>p.topics.forEach(t=>t.lessons.forEach(l=>{
  if(l.ready) FLAT.push({...l, part:p.num, partTitle:p.title, topic:t.title});
})));

const done=new Set(JSON.parse(localStorage.getItem(DONE_KEY)||'[]'));
const saveDone=()=>localStorage.setItem(DONE_KEY,JSON.stringify([...done]));
const cur=()=>decodeURIComponent((location.hash||'').replace(/^#/,'')).trim();
const find=f=>FLAT.findIndex(x=>x.file===f);

function srcOf(l){
  // 全部课件都是静态页 —— 受限内容由页内 paywall.js 客户端遮挡（Flexible Sampling）
  return 'slides/'+l.file+'?embed=1';
}

function renderTree(filter){
  const kw=(filter||'').trim().toLowerCase();
  const f=cur();
  let html='';
  CO.parts.forEach(p=>{
    let ptHtml='';
    p.topics.forEach(t=>{
      const ls=t.lessons.filter(l=>!kw || l.title.toLowerCase().includes(kw) || t.title.toLowerCase().includes(kw));
      if(!ls.length) return;
      const rdy=t.lessons.filter(l=>l.ready);
      const open = kw || t.lessons.some(l=>l.file===f);
      ptHtml+=`<div class="tp ${open?'open':''}">
        <div class="tp-h"><span class="ar">▸</span><span class="nm">${t.title}</span><span class="ct">${rdy.length} 节</span></div>
        <div class="tp-l">${ls.map(l=>{
          if(!l.ready) return `<div class="ls off"><span class="dot"></span><span>${l.title} · 待写</span></div>`;
          const lock=(typeof loggedIn==='function'&&!loggedIn()&&!FREE_PARTS.includes(p.num))?'<span class="lk">🔒</span>':'';
          return `<a class="ls ${l.file===f?'on':''} ${done.has(l.file)?'done':''}" href="#${encodeURIComponent(l.file)}">
            <span class="dot"></span><span>${l.title}${lock}</span></a>`;
        }).join('')}</div></div>`;
    });
    // 每章一张独立的「本章小测」卡片，挂在这一章目录的末尾；搜索时不掺和
    const ch=(typeof QCH!=='undefined')&&QCH[p.num];
    if(ptHtml&&ch&&!kw){
      const best=QBEST[ch]||0;
      const sc=best>=0.7?'<span class="sc pass">已通关 ✓</span>':(best>0?`<span class="sc">最好 ${Math.round(best*100)}%</span>`:'');
      ptHtml+=`<a class="quizls ${('quiz:'+ch)===f?'on':''}" href="#quiz:${ch}"><span>✦ 本章小测</span>${sc}</a>`;
    }
    if(ptHtml) html+=`<div class="pt"><div class="num">${p.num}</div><div class="ti">${p.title}</div></div>${ptHtml}`;
  });
  $('#tree').innerHTML=html||'<div style="padding:20px 8px;color:var(--faint);font-size:12.5px">没有匹配的知识点</div>';
  $('#tree').querySelectorAll('.tp-h').forEach(h=>h.onclick=()=>h.parentNode.classList.toggle('open'));
}

/* ── 「看过」标记：点开这一节就算 ────────────────────────────
   绿点=纯导航痕迹(浏览器 :visited 的意思)：只区分「哪些你打开过」，
   不表示看了多久，更不表示学没学会——那由本章小测说话。
   曾经用「滚动深度+停留时长」判，用户看了很久没点亮会纳闷，算法还偶尔不 work;
   规则能被用户一句话说清，本身就是价值(2026-08-25 用户拍板收敛)。 */
function markRead(file){
  if(done.has(file)) return;
  done.add(file); saveDone(); renderTree($('#q').value);
  const t=localStorage.getItem(TK);
  if(t) fetch(QAPI+'/api/progress',{method:'POST',
    headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},
    body:JSON.stringify({kind:'done',key:file,value:{on:true}})}).catch(()=>{});
}

function load(){
  let f=cur();
  const OLD2NEW={"zero-q-prompt.html": "zero-4.html", "ai-tips-context.html": "zero-4.html", "ai-tips-scenarios.html": "ai-tips-boundary.html", "zero-6.html": "ai-tips-boundary.html", "zero-final.html": "ai-tips-iterate.html", "0-intro.html": "start-dunning-kruger.html", "0-how.html": "start-how-to-learn.html", "0-why.html": "start-why-principles.html", "1-2-fake-chat.html": "hallu-fake-chat.html", "1-2-hallucination.html": "hallu-first-scene.html", "1-2-mitigation-prompt.html": "hallu-fix-prompt.html", "1-2-mitigation-rag.html": "hallu-fix-rag.html", "1-2-mitigation-temp.html": "hallu-fix-temp.html", "1-2-mitigation-eval.html": "hallu-fix-eval.html", "5-1.html": "context-window.html", "5-2.html": "context-overflow.html", "6-1.html": "prompt-system.html", "6-2.html": "prompt-advanced.html", "7-1.html": "agent-what.html", "10-1.html": "agent-vs-workflow.html", "7-4a.html": "agent-react.html", "7-4b.html": "agent-stuck.html", "8-1.html": "token-cost.html", "9-27.html": "cc-permissions.html", "9-28.html": "cc-permissions.html", "9-29.html": "harness-audit.html", "10-8.html": "eval-why.html", "10-9.html": "eval-graders.html", "10-10.html": "eval-pitfalls.html", "vibe-1.html": "vibe-rules.html", "vibe-2.html": "vibe-workflow.html", "vibe-5.html": "vibe-debug.html", "vibe-6.html": "vibe-complete.html", "vibe-7.html": "vibe-docs.html", "vibe-8.html": "vibe-env.html", "vibe-9.html": "vibe-safety.html", "oss-8.html": "jargon-deploy.html", "oss-9.html": "jargon-deploy.html", "interview-1.html": "interview-p1.html", "interview-2.html": "interview-p2.html", "interview-7.html": "interview-p4.html", "hr-org-1.html": "hr-org-3.html", "hr-org-2.html": "hr-org-3.html"};
  if(OLD2NEW[f]){ location.replace('#'+encodeURIComponent(OLD2NEW[f])); return; }
  if(/^quiz:/.test(f)){
    // #quiz:p-8 打开本章小测；#quiz:p-8:wrong 只练这一章的错题（成长页的错题本从这儿进来）
    const seg=f.slice(5).split(':');
    if(!loggedIn() && !FREE_CH.includes(seg[0])){ gateTo(f); return; }
    if(seg[1]==='wrong'){
      const w=loadWrong();
      const ids=Object.keys(w).filter(id=>w[id].ch===seg[0]);
      renderQuizView(seg[0], ids.length?ids:null);
    } else renderQuizView(seg[0]);
    return; }
  $('#quizpane').style.display='none'; $('#frame').style.display='block';
  let i=find(f);
  if(i<0){ i=0; f=FLAT[0].file; location.replace('#'+encodeURIComponent(f)); }
  const l=FLAT[i];
  if(!loggedIn() && !FREE_PARTS.includes(l.part)){ gateTo(f); return; }
  $('#frame').src=srcOf(l);
  document.title=l.title+' · meansights learning';
  const p=FLAT[i-1], n=FLAT[i+1];
  // 底部翻页条已撤：翻页走侧栏目录 + 键盘 ←→（iframe 内外都监听）
  window.goPrev=()=>p&&(location.hash='#'+encodeURIComponent(p.file));
  window.goNext=()=>n&&(location.hash='#'+encodeURIComponent(n.file));

  markRead(l.file);      /* 点开即记「看过」——纯 :visited 语义 */

  renderTree($('#q').value);
  const on=$('#tree .ls.on'); if(on) on.scrollIntoView({block:'nearest'});
  $('#side').classList.remove('show');
}

/* ── toast ── */
let _tt;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(_tt); _tt=setTimeout(()=>t.classList.remove('on'),2000);
}

/* ── 侧栏拖拽调宽 ── */
(function(){
  const K='hab_sidew', bar=$('#dragbar'), side=$('#side');
  try{ const w=+localStorage.getItem(K); if(w>=200&&w<=520) side.style.width=w+'px'; }catch(e){}
  let on=false;
  bar.addEventListener('mousedown',e=>{on=true;bar.classList.add('on');document.body.classList.add('dragging');e.preventDefault();});
  window.addEventListener('mousemove',e=>{
    if(!on) return;
    const w=Math.min(520,Math.max(200,e.clientX));
    side.style.width=w+'px';
  });
  window.addEventListener('mouseup',()=>{
    if(!on) return; on=false; bar.classList.remove('on'); document.body.classList.remove('dragging');
    try{ localStorage.setItem(K, parseInt(side.style.width)); }catch(e){}
  });
})();


$('#q').oninput=e=>renderTree(e.target.value);
$('#sbtn').onclick=()=>$('#side').classList.toggle('show');
window.addEventListener('hashchange',load);
/* 本章小测：每章一张独立卡片（目录里 ✦ 本章小测），点开在阅读区单独呈现。
   从本章题库随机抽 8 道；前端拿不到答案，点选后交服务端判分并回解析。
   全部答完给通关判定（≥70% 点亮），成绩落库（登录走服务端，匿名存本地）。 */
const QAPI=(location.hostname==='localhost'?'http://localhost:8001':'https://hr-ai-builder-api.onrender.com');
const QCH={'第零篇章':'p-zero','第一篇章':'p-1','第二篇章':'p-2','第三篇章':'p-3','第四篇章':'p-4',
           '第五篇章':'p-5','第六篇章':'p-6','第七篇章':'p-7','第八篇章':'p-8','第九篇章':'p-9'};
const QBEST_KEY='hab_quiz_best';
const QBEST=JSON.parse(localStorage.getItem(QBEST_KEY)||'{}');   // {章代码： 最好正确率}
function saveBest(ch,pct){
  if(pct>(QBEST[ch]||0)){ QBEST[ch]=pct; localStorage.setItem(QBEST_KEY,JSON.stringify(QBEST)); }
}
async function saveAttempt(ch,correct,n){
  saveBest(ch,n?correct/n:0);
  const t=localStorage.getItem(TK);
  if(t){
    try{ await fetch(QAPI+'/api/progress',{method:'POST',
      headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},
      body:JSON.stringify({kind:'quiz',key:ch,value:{correct,n}})}); }catch(e){}
  } else {
    try{ const h=JSON.parse(localStorage.getItem('hab_quiz_local')||'[]');
      h.push({ch,correct,n,ts:new Date().toISOString()});
      localStorage.setItem('hab_quiz_local',JSON.stringify(h.slice(-200))); }catch(e){}
  }
}

/* 错题本：跨章留存。key=题目 id，值记所属篇章、错过几次、最后一次时间。
   为什么值得存：错题是整个小测里信息量最大的部分——它直接指出你该回去补什么。
   做完就消失等于把最有用的东西扔了。 */
const WRONG_KEY='hab_wrong';
const loadWrong=()=>{ try{ return JSON.parse(localStorage.getItem(WRONG_KEY)||'{}'); }catch(e){ return {}; } };
function markWrong(ch, q, add){
  const w=loadWrong();
  if(add){ const e=w[q.id]||{ch, n:0}; e.n++; e.ts=Date.now(); e.ksa=q.ksa; e.ch=ch; w[q.id]=e; }
  else if(w[q.id]) delete w[q.id];        // 再练对了就从错题本里划掉
  try{ localStorage.setItem(WRONG_KEY, JSON.stringify(w)); }catch(e){}
  const t=localStorage.getItem(TK);
  if(t) fetch(QAPI+'/api/progress',{method:'POST',
    headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},
    body:JSON.stringify({kind:'quiz',key:ch,value:{correct:add?0:1,n:1}})}).catch(()=>{});
}
const KSA_NAME={K:'知识', S:'技能', A:'能力'};
const KSA_FIX={K:'回去读就能补，几天的事',
               S:'得动手做一遍才补得上，几周到几个月',
               A:'补不了，只能拿真实经历重新证明'};

/* ── 小测会话档案：一条规则管全部 ─────────────────────────────
   会话永远都在，只有两种结束方式：做完了，或用户自己点「+/再抽一轮」。
   切课、跨页、刷新、隔天回来，一律接着上回——系统没有任何"主动刷新"的分支。
   结构：{ [章]: { cur：会话|null, hist:[已归档会话...] } }
   会话={id,ts,wrongMode,done,score,html(对话快照),state(引擎断点)}
   快照只在"干净边界"打(开场完/每题判完/每轮对话完)：题中间的半截恢复不了，
   跨页回来那道题会重出一遍——这是存档粒度，不是丢失。 */
const QS_KEY='hab_quiz_sess';
const qsLoad=()=>{ try{ return JSON.parse(localStorage.getItem(QS_KEY)||'{}'); }catch(e){ return {}; } };
function qsPersist(store){
  /* 配额保护：超限先丢最老的归档场次，再不行丢最大的，活会话最后保 */
  for(let t=0;t<8;t++){
    try{ localStorage.setItem(QS_KEY,JSON.stringify(store)); return; }
    catch(e){
      let oldest=null;
      Object.values(store).forEach(c=>{ (c.hist||[]).forEach(s=>{ if(!oldest||s.ts<oldest.ts) oldest=s; }); });
      if(oldest){ Object.values(store).forEach(c=>{ c.hist=(c.hist||[]).filter(s=>s!==oldest); }); }
      else return;   // 连归档都没了还存不下——放弃这次落盘，内存里的会话不受影响
    } }
}
function qsArchive(chSt){
  if(chSt.cur){ const c=chSt.cur; delete c.state;   // 归档=只读档案，断点状态不再需要
    chSt.hist=[c,...(chSt.hist||[])].slice(0,5); chSt.cur=null; }
}

async function renderQuizView(ch, onlyIds, fresh){
  /* ── 对话式测评引擎 ──────────────────────────────────────────
     形态抄自我们自己的调研 agent(gaode-survey-agent)，同一条架构铁律：
     **状态机管流程，LLM 只填空。**
     - K/S 选择题：选项按钮嵌在对话流里，点选变成一条"我"的气泡；
       判分永远走服务端 /api/quiz/submit(答案不在前端)，零 LLM 成本，
       70% 通关闸、错题本、成绩曲线全部照旧——"点亮是测出来的"没动。
     - A 判断力题：无缝切到 quizA 模式(登录专属),Sparky 抛场景、追问、
       给参照，不打分；未登录给登录出口，不挡 K/S 完卷。 */
  const part=Object.keys(QCH).find(p=>QCH[p]===ch);
  if(!part){ location.replace('#'+encodeURIComponent(FLAT[0].file)); return; }
  $('#frame').style.display='none';
  const pane=$('#quizpane'); pane.style.display='block';
  document.title='本章小测 · '+part+' · meansights learning';
  renderTree($('#q').value);
  const inCh=FLAT.filter(l=>l.part===part);
  const lastIdx=find(inCh[inCh.length-1].file), next=FLAT[lastIdx+1];
  window.goPrev=()=>location.hash='#'+encodeURIComponent(inCh[inCh.length-1].file);
  window.goNext=()=>next&&(location.hash='#'+encodeURIComponent(next.file));

  /* 内存快路径：本页内切课再切回，对话 DOM 原封活着(load() 只藏不毁)，直接亮出来。
     只要还是这一章，不管当前场是常规还是错题重练，都接着聊。 */
  const wantWrong=!!(onlyIds&&onlyIds.length);
  if(!fresh && !wantWrong && (pane.dataset.live||'').split(':')[0]===ch && pane.querySelector('.hqc')){
    $('#side').classList.remove('show'); return; }

  /* 档案：fresh(+/再抽一轮)或明确点了错题重练=用户亲手重开，旧场归档；其余一律接上回 */
  const qstore=qsLoad(); const chSt=qstore[ch]||(qstore[ch]={cur:null,hist:[]});
  if(fresh||wantWrong) qsArchive(chSt);
  const resumed=!!chSt.cur;
  const SESS=resumed?chSt.cur
    :{id:Date.now(),ts:Date.now(),wrongMode:wantWrong,done:false,score:null,html:'',
      state:{phase:'open',ids:[],idx:0,total:0,ansN:0,okN:0,wrongL:[],wrongTags:[],streak:0,misses:0,kHist:[],
             extras:null,eidx:0,aIds:null,aHist:[]}};
  chSt.cur=SESS;
  const st=SESS.state||(SESS.state={phase:'done',ids:[],idx:0,total:0,ansN:0,okN:0,wrongL:[],wrongTags:[],
             streak:0,misses:0,kHist:[],extras:null,eidx:0,aIds:null,aHist:[]});
  const onlyWrong=SESS.wrongMode;   // 模式跟着会话走，不跟入口参数走(断点续传时入口没带 ids)
  pane.dataset.live=ch+(onlyWrong?':wrong':'');

  pane.innerHTML='<div class="hqc">'+
    '<div class="hqc-tools">'+
      '<button class="hqc-ib" id="hq-new" title="新开一场"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>'+
      '<button class="hqc-ib" id="hq-hi" title="过往场次"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>'+
    '</div>'+
    '<div class="hqc-log"></div>'+
    '<div class="hqc-inp"><div class="hqc-shell"><textarea rows="1" placeholder="说说你的思路…"></textarea>'+
    '<div class="hqc-btm"><button class="hqc-end">聊完了，收尾</button><span style="flex:1"></span>'+
    '<button class="hqc-send" title="发送"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div></div></div></div>'+
    '<div class="hqc-histp"></div>';
  const logEl=pane.querySelector('.hqc-log'), inpRow=pane.querySelector('.hqc-inp'),
        ta=pane.querySelector('.hqc-inp textarea'), sendBtn=pane.querySelector('.hqc-send'),
        endBtn=pane.querySelector('.hqc-end'), histp=pane.querySelector('.hqc-histp');

  /* 快照落盘：引擎在每个"干净边界"调它。counters 是闭包本地变量，落盘时同步进 state */
  const save=()=>{
    Object.assign(st,{ansN,okN,streak,misses,wrongL:wrongList.map(x=>x.ksa),
      wrongTags:wrongTags.slice(),kHist:kHist.slice(-6)});
    SESS.html=logEl.innerHTML; SESS.ts=Date.now(); qsPersist(qstore); };

  /* 右上角工具：+ 新开一场 / 时钟看过往(同 Sparky 浮窗) */
  pane.querySelector('#hq-new').onclick=()=>renderQuizView(ch,null,true);
  const fmtT=ts=>{ const d=new Date(ts);
    return (d.getMonth()+1)+'-'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
  const openHist=()=>{
    if(histp.classList.contains('on')){ histp.classList.remove('on'); return; }
    const r=pane.getBoundingClientRect();
    histp.style.left=r.left+'px'; histp.style.top=r.top+'px';
    histp.style.width=r.width+'px'; histp.style.height=r.height+'px';
    const rows=chSt.hist||[];
    histp.innerHTML='<div class="hqc-hhead"><b>过往场次</b><span style="flex:1"></span><button class="hqc-hback">✕ 关闭</button></div>'+
      (rows.length? rows.map((s,i)=>'<button class="hqc-hrow" data-i="'+i+'"><span class="hd">'+fmtT(s.ts)+'</span>'+
          '<span class="hs">'+(s.wrongMode?'错题重练':'本章小测')+(s.done?'':' · 没做完')+'</span>'+
          (s.score?'<span class="hp">'+s.score.ok+' / '+s.score.n+(s.score.n&&s.score.ok/s.score.n>=0.7?' · 通关':'')+'</span>':'')+
        '</button>').join('')
      :'<div class="hqc-hempty">还没有归档的场次——点「+」新开一场时，当前这场会存到这里。</div>');
    histp.querySelector('.hqc-hback').onclick=()=>histp.classList.remove('on');
    histp.querySelectorAll('.hqc-hrow').forEach(rw=>rw.onclick=()=>{
      const s=rows[+rw.dataset.i];
      histp.innerHTML='<div class="hqc-hhead"><button class="hqc-hback" id="hq-hls">← 场次列表</button>'+
        '<b>'+fmtT(s.ts)+' 的一场(只读)</b><span style="flex:1"></span><button class="hqc-hback" id="hq-hx">✕ 关闭</button></div>'+
        '<div class="hqc hqc-hview">'+s.html+'</div>';
      histp.querySelectorAll('.hqc-hview button').forEach(b=>b.disabled=true);
      histp.querySelector('#hq-hls').onclick=()=>{ histp.classList.remove('on'); openHist(); };
      histp.querySelector('#hq-hx').onclick=()=>histp.classList.remove('on');
    });
    histp.classList.add('on'); histp.scrollTop=0; };
  pane.querySelector('#hq-hi').onclick=openHist;
  const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const md=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
  const scroll=()=>{ pane.scrollTop=pane.scrollHeight; };
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  /* bot 气泡带 Sparky 头像；botNow 立即渲染(SSE 流式自己写字),bot 走打字机 */
  const mkBot=()=>{ const m=document.createElement('div'); m.className='hqm bot';
    m.innerHTML='<span class="hq-dot">●</span><div class="hqb"></div>';
    logEl.appendChild(m); scroll(); return m.querySelector('.hqb'); };
  const botNow=html=>{ const b=mkBot(); b.innerHTML=html; scroll(); return b; };
  /* 打字机：富文本按 DOM 结构逐字符流出，<b> 等标签结构保留 */
  const typeHTML=(el,html)=>new Promise(res=>{
    const tpl=document.createElement('div'); tpl.innerHTML=html;
    el.classList.add('live');
    const steps=[];
    (function collect(src,dst){ for(const n of src.childNodes){
      if(n.nodeType===3) steps.push({txt:n.textContent,parent:dst});
      else{ const c=n.cloneNode(false); steps.push({el:c,parent:dst}); collect(n,c); } } })(tpl,el);
    let i=0;
    const tick=()=>{ const st=steps[i];
      if(!st){ el.classList.remove('live'); scroll(); res(); return; }
      i++;
      if(st.el){ st.parent.appendChild(st.el); tick(); return; }
      const tn=document.createTextNode(''); st.parent.appendChild(tn);
      let j=0; const iv=setInterval(()=>{ j+=2; tn.textContent=st.txt.slice(0,j); scroll();
        if(j>=st.txt.length){ clearInterval(iv); tick(); } },16); };
    tick(); });
  const bot=html=>{ const b=mkBot(); return typeHTML(b,html).then(()=>b); };
  const me=text=>{ const m=document.createElement('div'); m.className='hqm me';
    m.innerHTML='<div class="hqb"><span class="hq-umark">›</span><span class="hq-ubody">'+esc(text)+'</span></div>';
    logEl.appendChild(m); scroll(); };
  /* 反馈不念稿：按对错、连对连错、进度挑话说——还是状态机，只是不机械 */
  let streak=st.streak||0, misses=st.misses||0;
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const okLine=()=>{ streak++; misses=0;
    if(streak>=3) return pick(['✓ '+streak+' 连对，手感来了。','✓ 又对——连着 '+streak+' 道了。']);
    if(streak===2) return pick(['✓ 连着两道，稳。','✓ 又对。']);
    return pick(['✓ 对了。','✓ 没错。','✓ 就是这个。']); };
  const badLine=()=>{ const wasStreak=streak>=2; streak=0; misses++;
    if(wasStreak) return '✗ 断在这道——看看差在哪：';
    if(misses>=2) return pick(['✗ 这道也不对——别急，解析里有钩子：','✗ 又差一点。这道的关键：']);
    return pick(['✗ 不对。','✗ 差一点。','✗ 这道不对——']); };

  const doneReplay=resumed&&SESS.done;
  let pool=[], aPool=[], items=[], total=0;
  if(!doneReplay){
    botNow('<span class="hqc-typing">Musing…</span>');
    try{ const r=await fetch(QAPI+'/api/quiz?chapter='+ch); if(r.ok) pool=(await r.json()).items||[]; }catch(e){}
    logEl.innerHTML='';
    if(!pool.length){ pane.dataset.live=''; botNow('题目没取到——网络抖了下，切走再切回来重试。'); return; }
    aPool=pool.filter(x=>x.ksa==='A');
    if(resumed&&st.ids.length){
      /* 断点续传：按存档题序复原。题库更新对不上号时这场接不上——归档留档，重开新场 */
      items=st.ids.map(id=>pool.find(x=>x.id===id));
      if(items.some(x=>!x)){ qsArchive(chSt); qsPersist(qstore); pane.dataset.live='';
        return renderQuizView(ch,null,true); }
      total=st.total||items.length;
    } else {
      items = onlyIds && onlyIds.length
          ? pool.filter(x=>onlyIds.includes(x.id))
          : pool.filter(x=>x.ksa!=='A').sort(()=>Math.random()-.5).slice(0,8);
      if(!items.length){ pane.dataset.live=''; botNow('这些错题在本章题库里找不到了（题库更新过）。换一轮吧。'); return; }
      st.ids=items.map(x=>x.id); st.total=total=items.length;
    }
  }

  let ansN=st.ansN||0, okN=st.okN||0;
  const wrongList=(st.wrongL||[]).map(k=>({ksa:k})), wrongTags=(st.wrongTags||[]).slice();
  let pendingQ=null;   // 正在作答、还没判分的题——此时答疑要拦，防泄答案

  /* ── 共用 SSE:quizA(判断题)与 quizK(选择题伴考)都走这条管道 ── */
  const sseChat=async(messages,ctxExtra,bub)=>{
    let reply='';
    const r=await fetch(QAPI+'/api/sparky/chat',{method:'POST',
      headers:{'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem(TK)},
      body:JSON.stringify({messages,ctx:Object.assign({page:'learn',done:[],visitor:(localStorage.getItem('hab_vid')||'')},ctxExtra)})});
    if(!r.ok){ let dd=''; try{ dd=(await r.json()).detail||''; }catch(e){}
      bub.textContent=dd||'连不上了——继续做题，不影响。'; return ''; }
    const rd=r.body.getReader(), dec=new TextDecoder(); let buf='';
    while(true){ const x=await rd.read(); if(x.done) break;
      buf+=dec.decode(x.value,{stream:true});
      const lines=buf.split('\n\n'); buf=lines.pop();
      for(const ln of lines){ if(ln.slice(0,6)!=='data: ') continue;
        let ev; try{ ev=JSON.parse(ln.slice(6)); }catch(e){ continue; }
        if(ev.t==='delta'){ reply+=ev.text; bub.innerHTML=md(reply); scroll(); }
        else if(ev.t==='refs'&&(ev.items||[]).length){
          const rw=document.createElement('div'); rw.className='hqc-refs';
          rw.innerHTML=ev.items.map(it=>'<a href="#'+encodeURIComponent(it.file)+'">📖 '+esc(it.title)+' · '+it.min+"′</a>").join('');
          logEl.appendChild(rw); scroll(); }
        else if(ev.t==='err'){ bub.textContent=ev.msg; } } }
    return reply; };

  /* ── 每道 K/S 题 ─────────────────────────────────────────────
     真对话和「问卷套皮」的分水岭：你的回答有没有被听见。
     所以：答错(登录时)不直接念解析——Sparky 针对你选的那个错项反问一句，
     给第二次机会；二次作答后才揭参照。计分与错题本都按第一次(否则闸变松)。
     加练题(extra)不计分——目的是掌握，不是分数。 ── */
  let curQ=null;                       // 最近一道判过的题，输入框答疑用
  let curReprobe=null, rHist=[];       // 反问进行中的题与对话——打字回应反问要接得住，不能拦
  const askKS=(q,qi,extra)=>new Promise(async resolve=>{
    if(extra) st.eidx=qi; else st.idx=qi;
    save();   /* 干净边界：这道题还没出，快照停在上一题判完处 */
    if(!extra&&qi===Math.floor(items.length/2)&&qi>1){
      await bot(okN>=qi-1?'过半了，一道没丢——继续。':(okN>=qi/2?'过半了，状态在线。':'过半了。前面错的那几道，解析别跳过——后半段还会碰到同类。'));
      await sleep(300); }
    /* 出题引导语：自然语言带出来，不用「第N/M题」标签；题干高亮让人一眼认出问的是什么 */
    const tyName=q.type==='multi'?'多选题':(q.type==='judge'?'判断题':'单选题');
    const tyNote=q.type==='multi'?'，选完点确认':'';
    const lead = extra ? '这道不计分——「'+esc(q.tag||'刚才那个')+'」考点的同类'+tyName+'，验一下是真懂了还是碰巧'+tyNote+'：'
      : qi===0 ? pick(['好，咱们开始。第一道，是道'+tyName+tyNote+'：','先来第一道，'+tyName+tyNote+'：'])
      : qi===items.length-1 ? pick(['最后一道了，'+tyName+tyNote+'：','收官这道，'+tyName+tyNote+'：'])
      : pick(['下一道，','继续，','接着来，','再来，'])+tyName+tyNote+'：';
    await bot(lead+'<div class="hqc-q">'+q.q+'</div>');
    const row=document.createElement('div'); row.className='hqc-opts';
    const btns=q.opts.map(o=>{ const b=document.createElement('button');
      b.className='hqc-opt'; b.innerHTML=o; row.appendChild(b); return b; });
    logEl.appendChild(row); scroll();
    pendingQ=q;
    let tries=0, firstCorrect=null;
    const mkConfirm=()=>{ const go=document.createElement('button'); go.className='hqc-goml'; go.textContent='确认';
      go.onclick=()=>{ const sel=btns.map((b,i)=>b.classList.contains('sel')?i:-1).filter(i=>i>=0);
        if(!sel.length) return; go.remove(); judge(sel); };
      row.appendChild(go); scroll(); };
    const finalize=async(d,given)=>{ /* 揭晓：标参照、给解析、落账 */
      const ans=Array.isArray(d.ans)?d.ans:[d.ans];
      row.classList.add('answered');
      btns.forEach((b,i)=>{ if(ans.includes(i)) b.classList.add('ok');
        else if(b.classList.contains('sel')||(!Array.isArray(given)&&i===given)) b.classList.add('bad'); });
      const head = firstCorrect ? okLine()
        : (tries>1&&d.correct ? '✓ 这回对了——第一下踩的坑记住，它才是这道题的价值。'
        : badLine());
      await bot(head+' '+(d.exp||''));
      if(window.habTrack) habTrack('quiz',{extra:{chapter:ch,qid:q.id,correct:!!firstCorrect,extra:!!extra}});
      if(!firstCorrect){ wrongList.push({ksa:d.ksa||q.ksa||'K'}); wrongTags.push(q.tag||''); }
      markWrong(ch,{id:q.id,ksa:d.ksa||q.ksa||'K'},!firstCorrect);
      if(!extra){ ansN++; okN+=firstCorrect?1:0; }
      curQ=q; pendingQ=null; curReprobe=null; rHist=[];
      if(extra) st.eidx=qi+1; else st.idx=qi+1;
      save();   /* 判完+解析已上屏，又一个干净边界 */
      await sleep(400); resolve(); };
    const judge=async given=>{
      tries++;
      row.classList.add('answered');
      me(Array.isArray(given)? given.map(i=>q.opts[i].replace(/<[^>]+>/g,'')).join(' + ')
                             : q.opts[given].replace(/<[^>]+>/g,''));
      let d=null;
      try{ const res=await fetch(QAPI+'/api/quiz/submit',{method:'POST',
        headers:{'Content-Type':'application/json'},body:JSON.stringify({answers:{[q.id]:given}})});
        if(res.ok) d=(await res.json()).details[0]; }catch(e){}
      if(!d){ botNow('这题没判上——网络抖了，跳过它继续。'); resolve(); return; }
      if(tries===1) firstCorrect=d.correct;
      /* 判断题二选一：说「不对」就等于报答案，「再选一次」毫无信息量——答错直接揭参照讲为什么 */
      if(d.correct || tries>1 || !loggedIn() || q.type==='judge'){ await finalize(d,given); return; }
      /* 答错第一次：不再垫固定句，判定信号交给 Sparky 用自己的话在同一条消息里说清(后端 reprobe 场景要求开头亮信号);
         视觉信号由错选项标红兜底 */
      const pickedArr=Array.isArray(given)?given:[given];
      curReprobe={q:q, picked:pickedArr};
      rHist=[{role:'user',content:'这道题我选了：'+pickedArr.map(i=>q.opts[i].replace(/<[^>]+>/g,'')).join('、')}];
      const bub=botNow('<span class="hqc-typing">Musing…</span>');
      const rr=await sseChat(rHist.slice(-8),
        {mode:'quizK',quiz_qid:q.id,quiz_picked:pickedArr,quiz_stage:'reprobe'},bub);
      if(rr) rHist.push({role:'assistant',content:rr});
      /* 重开选项：错选保持红、锁死；其余恢复可点 */
      row.classList.remove('answered');
      btns.forEach((b,i)=>{ if(pickedArr.includes(i)){ b.classList.add('bad'); b.disabled=true; }
        b.classList.remove('sel'); });
      if(q.type==='multi') mkConfirm();
      const hint=document.createElement('div'); hint.className='hqc-hint';
      hint.textContent='想好了就回上面再选一次；也可以直接打字跟我说你的想法。';
      logEl.appendChild(hint); scroll(); };
    if(q.type==='multi'){ btns.forEach(b=>b.onclick=()=>{ if(!b.disabled) b.classList.toggle('sel'); }); mkConfirm(); }
    else btns.forEach((b,i)=>b.onclick=()=>{ if(b.disabled||row.classList.contains('answered'))return;
      b.classList.add('sel'); judge(i); });
  });

  /* ── 收尾动作行 ── */
  const actions=()=>{ const acts=document.createElement('div'); acts.className='hqc-acts';
    const mk=(t,cls,fn)=>{ const b=document.createElement('button');
      b.className='hqc-act'+(cls?' '+cls:''); b.textContent=t; b.onclick=fn; acts.appendChild(b); };
    const w=loadWrong(), wIds=Object.keys(w).filter(id=>w[id].ch===ch);
    if(wIds.length) mk('只练错题（'+wIds.length+'）','',()=>{ renderQuizView(ch,wIds,true); });
    mk('再抽一轮','',()=>renderQuizView(ch,null,true));
    const nextCh=next&&next.part!==part?next:null;
    if(next) mk('去下一章 →','pri',()=>location.hash='#'+encodeURIComponent(next.file));
    mk('回本章第一节','ghost',()=>location.hash='#'+encodeURIComponent(inCh[0].file));
    logEl.appendChild(acts); scroll(); };
  const finish=()=>{ actions(); SESS.done=true; SESS.score={ok:okN,n:total||1}; st.phase='done'; save(); };

  /* 完结场次回放：成绩单原样躺回来；动作行重建(按钮要活的) */
  if(doneReplay){
    logEl.innerHTML=SESS.html;
    logEl.querySelectorAll('button').forEach(b=>b.disabled=true);
    logEl.querySelectorAll('.hqc-acts').forEach(a=>a.remove());
    actions(); scroll(); return;
  }
  /* 未完结断点：对话记录静态躺回(已判的题本来就是锁死的)，引擎从断点接着跑 */
  if(resumed){
    logEl.innerHTML=SESS.html;
    logEl.querySelectorAll('button').forEach(b=>b.disabled=true);
    scroll();
  }

  /* ── 开场 ── */
  /* 开场：交给模型当这场巩固的主持人(定位=巩固不是考试，见后端 open 场景)。
     真值情况(读了几节/上回成绩/首次或重练)由系统消息给它，话让它自己说。
     匿名无 LLM，一句脚本兜底，不装腔。 */
  if(st.phase==='open'){
    const readN=inCh.filter(l=>done.has(l.file)).length;
    const prevBest=Math.round((QBEST[ch]||0)*100);
    if(loggedIn()){
      const situ='(系统：用户进入「'+part+'」的本章巩固。'+
        (onlyWrong
          ? '这次是错题重练，共 '+items.length+' 道上回错的题。'
          : '本章 '+inCh.length+' 节已读 '+readN+' 节；'+
            (prevBest>0?'上回小测最好 '+prevBest+'%'+(prevBest>=70?'(已通关)':'(未通关)'):'第一次做本章小测')+
            '；本轮知识与技能题 '+items.length+' 道'+(aPool.length?'，之后还有判断力对话':'')+'。')+
        '请按 open 场景开场。)';
      const bub=botNow('<span class="hqc-typing">Musing…</span>');
      await sseChat([{role:'user',content:situ}],{mode:'quizK',quiz_stage:'open',quiz_chapter:ch},bub);
    } else {
      await bot(onlyWrong
        ? '错题重练——这 '+items.length+' 道是你上次错的，练对就划掉。'
        : '来把这章钉扎实。<b>知识与技能题 '+items.length+' 道</b>，答对 70% 点亮本章，答错看解析。');
    }
    await sleep(300);
    st.phase='ks'; save();
  }
  /* K/S 段：答疑输入框常开(登录时)——单行道变双行道 */
  let phase='ks'; const kHist=(st.kHist||[]).slice(); let sendA=null;
  const kAsk=async v=>{
    me(v);
    /* 反问进行中：用户打字回应反问 → 顺着掰扯(同一场 reprobe 对话)，别拦 */
    if(pendingQ && curReprobe && curReprobe.q===pendingQ){
      rHist.push({role:'user',content:v});
      ta.disabled=true; sendBtn.disabled=true;
      const bub2=botNow('<span class="hqc-typing">Musing…</span>');
      const r2=await sseChat(rHist.slice(-8),
        {mode:'quizK',quiz_qid:pendingQ.id,quiz_picked:curReprobe.picked,quiz_stage:'reprobe'},bub2);
      if(r2) rHist.push({role:'assistant',content:r2});
      ta.disabled=false; sendBtn.disabled=false; ta.focus(); return; }
    /* 作答前的提问(题型/题意/概念)也正面回答——preask 场景零泄题；判分后走 ask 可放开讲 */
    const stage=pendingQ?'preask':'ask';
    const qid=pendingQ?pendingQ.id:(curQ?curQ.id:null);
    if(!qid){ await bot('还没开考呢。开始做题后，随时来问。'); return; }
    kHist.push({role:'user',content:v});
    ta.disabled=true; sendBtn.disabled=true;
    const bub=botNow('<span class="hqc-typing">Musing…</span>');
    const reply=await sseChat(kHist.slice(-6),{mode:'quizK',quiz_qid:qid,quiz_stage:stage},bub);
    if(reply) kHist.push({role:'assistant',content:reply});
    if(!pendingQ) save();   /* 判分后的答疑落快照；作答前的 preask 不落(题开着，非边界) */
    ta.disabled=false; sendBtn.disabled=false; };
  const submitMsg=()=>{ const v=ta.value.trim(); if(!v||ta.disabled) return; ta.value='';
    if(phase==='a') sendA(v); else kAsk(v); };
  sendBtn.onclick=submitMsg;
  ta.onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); submitMsg(); } };
  if(loggedIn()){ inpRow.style.display='flex'; endBtn.style.display='none';
    ta.placeholder='对题目或解析有疑问？随时打字问我，不影响考试'; }
  if(st.phase==='ks'){
    for(let i=st.idx;i<items.length;i++) await askKS(items[i],i);
    st.phase='extras'; st.eidx=0; save();
  }

  /* 自适应加练：栽过的考点，抽同类题再验一遍(不计分，纯状态机)。
     抽了哪几道记进存档，断点回来不换题、不重发开场白 */
  if(st.phase==='extras'){
    if(!onlyWrong){
      let extras;
      if(st.extras){ extras=st.extras.map(id=>pool.find(x=>x.id===id)).filter(Boolean); }
      else{
        const seen=new Set(items.map(x=>x.id));
        const tagsLeft=[...new Set(wrongTags.filter(Boolean))];
        extras=[];
        for(const tg of tagsLeft){
          const cand=pool.filter(x=>x.ksa!=='A'&&!seen.has(x.id)&&(x.tag||'')===tg);
          if(cand.length&&extras.length<2){ const pk=cand[Math.floor(Math.random()*cand.length)];
            extras.push(pk); seen.add(pk.id); } }
        st.extras=extras.map(x=>x.id); save();
        if(extras.length){
          await bot('等下，先别看总分——「'+extras.map(x=>esc(x.tag||'同类')).join('」和「')+
            '」这'+(extras.length>1?'几':'')+'个考点你刚栽过。我从题库再抽'+extras.length+'道同类的，验一下是真懂了还是碰巧——<b>不计分</b>。');
          await sleep(300);
        }
      }
      for(let i=st.eidx;i<extras.length;i++) await askKS(extras[i],i,true);
    }
    st.phase='sum'; save();
  }

  /* ── K/S 小结：通关判定与落库，全部照旧 ── */
  let firstA=false;
  if(st.phase==='sum'){
    const pct=okN/total, pass=pct>=0.7;
    const best=Math.round((QBEST[ch]||0)*100);
    let sum=(pass?'🎉 <b>本章通关</b>':(onlyWrong?'错题重练完成':'<b>差一点</b>'))+' · 答对 '+okN+' / '+total;
    if(!onlyWrong) sum+='<br>本章最好成绩 '+Math.max(best,Math.round(pct*100))+'%'+(pass?'':' · 答对 70% 即可点亮本章');
    if(wrongList.length){
      const byK={}; wrongList.forEach(x=>byK[x.ksa]=(byK[x.ksa]||0)+1);
      sum+='<br>'+Object.keys(byK).map(k=>'错了 '+byK[k]+' 道'+KSA_NAME[k]+'题——'+KSA_FIX[k]).join('<br>');
    }
    await bot(sum);
    if(!onlyWrong) saveAttempt(ch,okN,total);
    renderTree($('#q').value);

    if(onlyWrong || !aPool.length){ finish(); return; }
    await sleep(600);
    if(!loggedIn()){
      const b=await bot('接下来本来还有 '+aPool.length+' 道<b>判断力题</b>——那部分不打分，是聊出来的，要登录才能开。');
      const lb=document.createElement('button'); lb.className='hqc-act pri'; lb.textContent='登录后继续';
      lb.onclick=()=>gateTo('quiz:'+ch); b.appendChild(document.createElement('br')); b.appendChild(lb);
      finish(); return;
    }
    st.aIds=aPool.sort(()=>Math.random()-.5).slice(0,3).map(x=>x.id);
    await bot('选择题到此为止。接下来 <b>'+st.aIds.length+' 道判断力题</b>——这部分不打分：我抛场景，你说思路，我追问，然后给你课程的参照判断，你自己比。聊完给你一段思维画像。');
    st.phase='a'; save(); firstA=true;
  }

  /* ── A 段：判断力题，LLM 接管(新进入或断点续上——续上时上一轮对话已在快照里，话筒直接递回用户) ── */
  if(st.phase==='a'){
    if(!loggedIn()){
      const b=await bot('这场聊到一半的判断力对话，要登录才能继续。');
      const lb=document.createElement('button'); lb.className='hqc-act pri'; lb.textContent='登录后继续';
      lb.onclick=()=>gateTo('quiz:'+ch); b.appendChild(document.createElement('br')); b.appendChild(lb);
      return;
    }
    const aIds=st.aIds||[], hist=(st.aHist||[]).slice();
    sendA=async(text,silent)=>{
      if(!silent) me(text);
      hist.push({role:'user',content:text});
      ta.disabled=true; sendBtn.disabled=true;
      const bub=botNow('<span class="hqc-typing">Musing…</span>');
      try{
        const reply=await sseChat(hist.slice(-10),{mode:'quizA',quiz_ids:aIds},bub);
        if(reply) hist.push({role:'assistant',content:reply});
      }catch(e){ bub.textContent='网络断了一下——再发一次就行。'; }
      st.aHist=hist.slice(-10); save();
      ta.disabled=false; sendBtn.disabled=false; ta.focus();
    };
    phase='a';
    inpRow.style.display='flex'; endBtn.style.display='';
    ta.placeholder='说说你的思路…';
    endBtn.onclick=async()=>{ inpRow.style.display='none';
      await bot('好，这轮到这。判断力没有分数——上面每道题你和参照的差别，就是下一步该看的方向。'); finish(); };
    if(firstA) sendA('开始吧，出第一道',true);
  }
}

/* iframe 内按 ←/→ 也能翻节：same-origin，把按键转发到父页 */
$('#frame').addEventListener('load',()=>{ try{
  $('#frame').contentDocument.addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
    if(e.key==='ArrowLeft') window.goPrev&&window.goPrev();
    if(e.key==='ArrowRight') window.goNext&&window.goNext();
  });
}catch(e){} });
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowLeft') window.goPrev&&window.goPrev();
  if(e.key==='ArrowRight') window.goNext&&window.goNext();
});

/* 登录态 + 服务端进度合并：学完的节、各章最好成绩都跟着账号走 */
(async function(){
  const t=localStorage.getItem(TK); if(!t) return;
  const b=$('#loginBtn');
  const show=u=>{ b.className='uava'; b.title=(u.nickname||'')+' · 我的成长';
    b.innerHTML=u.avatar?'<img src="'+u.avatar+'" alt="">':'<span class="ph">'+(u.nickname||'我')[0]+'</span>';
    b.href='growth.html'; };
  try{ const c=JSON.parse(localStorage.getItem('hab_user')||'null'); if(c) show(c); }catch(e){}  // 同步先画缓存，不闪"登录"
  try{
    const r=await fetch(QAPI+'/api/me',{headers:{Authorization:'Bearer '+t}});
    if(!r.ok){ if(r.status===401){ localStorage.removeItem(TK); localStorage.removeItem('hab_user');
      b.className='uava'; b.title='登录'; b.href='index.html#login';
      b.innerHTML='<span class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>'; } return; }
    const u=await r.json();
    localStorage.setItem('hab_user',JSON.stringify({nickname:u.nickname,avatar:u.avatar}));
    show(u);
    const pr=await fetch(QAPI+'/api/progress',{headers:{Authorization:'Bearer '+t}});
    if(pr.ok){ const pg=await pr.json();
      (pg.done||[]).forEach(f=>done.add(f)); saveDone();
      Object.entries(pg.best||{}).forEach(([ch,p])=>saveBest(ch,p));
      renderTree($('#q').value); }
  }catch(e){}
})();

load();
